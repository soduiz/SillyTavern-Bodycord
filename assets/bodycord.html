<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root,[data-theme="light"]{
  --rail:#e6e8eb;--side:#f1f2f4;--main:#ffffff;--member:#f1f2f4;
  --surface:#ffffff;--surface-2:#f7f8f9;--surface-3:#eceef1;
  /* 小灰字这一档跟外壳对齐 ——
     ⚠️ --tx-3 不要用 #8a8f98：压白只有 3.25:1 ✗（外壳那份是 #666b73 = 5.36:1）；
     --tx-4 更淡（1.95:1，那不是"安静"是看不见）⇒ 提到 3.25:1 ✓ */
  --tx-1:#0b0c0e;--tx-2:#4a4d55;--tx-3:#666b73;--tx-4:#8a8f98;
  --line:rgba(0,0,0,.08);--hover:rgba(0,0,0,.04);--active:rgba(0,0,0,.07);
  --blurple:#5f66c9;--blurple-2:#6a70c0;--blurple-dim:#e9ebf8;
  /* 日、夜两套一起把饱和度拉低 ✓ ⇒ 整套强调色**降饱和**
     （⚠️ 不用 #8b5cf6 / #14b8a6 / #ec5b9a 那种纯艳色，太突兀）
     ⚠️ 这些色会**当文字用**（数字 / 标题）⇒ 浅色主题压白底必须 ≥ 4.5:1 ✓ */
  --green:#2f7d52;--yellow:#8f6114;--red:#bc4a4e;
  --purple:#7a66c9;--purple-dim:#f0edfa;--gold:#c9922c;
  /* 「选中的那颗胶囊 / 实心按钮」专用的实心配色（旧的金底深棕字看着难受 ✗）
     为什么单独开两个变量：**实心块上的字要够清楚**，而 `--gold` 还得继续当装饰色用
     （标题 / 标签 / 图标 / 徽章都靠它）⇒ 不能为了这一个用途把整条金改了 ✗
     实测对比度（WCAG）：旧的「金底 #c9922c + 深棕字 #2a1f05」= 5.89:1（过了 AA，但看着还是难受）；
     白字压这个金只有 2.81:1 ✗ ⇒ 现在浅色用「#4338ca + 白字」= 7.90:1 ✓ */
  --sel-bg:#4338ca;--sel-tx:#ffffff;
  --pink:#b8547f;--pink-dim:#faeef4;--cyan:#177a70;--cyan-dim:#e6f2f1;
  /* 补一个"蓝" —— 孩子的**性别色**（男蓝女粉）：
     ⚠️ 不要写死亮蓝 #4a90e2（跟整套降饱和的色调不是一套 ✗）⇒ 收进调色板，
     跟 --pink 一个规格：浅色 #3f6f9e（白字 5.28:1 ✓）、深色 #9dbfe4（近黑字 8.81:1 ✓，
     配 --sel-tx 用 —— 深色下浅底必须配深字，不然白字压浅粉只有 1.9:1 ✗） */
  --blue:#3f6f9e;--blue-dim:rgba(63,111,158,.10);
  --scroll-thumb:rgba(0,0,0,.2);--scroll-thumb-hover:rgba(0,0,0,.32);
  --lv0:#9ca3af;--lv1:#177a70;--lv2:#2f7d52;--lv3:#8f6114;--lv4:#a9761c;--lv5:#bc4a4e;
  /* 「在线状态」那几个点**不跟皮肤一起降饱和**：
     状态色降了不符合正常逻辑 ⇒ 用降饱和之前的原值 ✓
     ⇒ 判据：绿=在线 / 黄=挂机 / 红=勿扰 是**通用语义**，跟"皮肤配色"不是一回事 ——
       皮肤可以按偏好降饱和，状态色降了就是"不符合正常逻辑"（这一点也被点破了 ✓）
     ⚠️ 下面这三个是**降饱和之前**面板里的原值，
       别再让"以后哪次调色"顺手把这两行改掉（units 里有断言守着 ✗） */
  --st-online:#22a559;--st-idle:#e5a41f;--st-dnd:#e5484d;
}
[data-theme="dark"]{
  --rail:#1c1b19;--side:#242220;--main:#2a2724;--member:#242220;
  --surface:#302d29;--surface-2:#292724;--surface-3:#1f1e1c;
  --tx-1:#e8e3da;--tx-2:#a8a29a;--tx-3:#a49e95;--tx-4:#7a756e;
  --line:rgba(255,255,255,.055);--hover:rgba(255,255,255,.045);--active:rgba(255,255,255,.075);
  --blurple:#8b93d6;--blurple-2:#a9afdd;--blurple-dim:rgba(139,147,214,.16);
  /* 深色主题：**亮但低饱和**（旧的那些太突兀 ⇒ 全部降饱和 ✓）
     ⚠️ 这些色压在深底上会当文字用 ⇒ 每个都 ≥ 5.5:1（实测值见 自测脚本 的配色断言 ✓） */
  --green:#6cc494;--yellow:#d9b25e;--red:#e08f92;
  --purple:#b3a6e2;--purple-dim:rgba(179,166,226,.14);--gold:#e0b150;
  /* 深色的"选中"用**跟浅色同一个色相**（靛紫）——
     金色还给「金 / 警告」那一类用（不然"选中"和"警告"撞成同一个色 ✗），
     而且浅暗暗两个主题**同一色相**才叫统一（浅色靛紫、深色金色＝自己翻了个色 ✗）。
     ⚠️ 两层的值必须**逐字相同**（外壳那份是 style.css 的 `--bc-sel-*`，units 有断言逐项比对 ✓） */
  --sel-bg:#a9afdd;--sel-tx:#1f1d1b;
  --pink:#dd9ab8;--pink-dim:rgba(221,154,184,.12);--cyan:#6cc4b8;--cyan-dim:rgba(108,196,184,.12);
  /* 男蓝 —— 见浅色那份的说明（深色用浅底 + 近黑字 ✓） */
  --blue:#9dbfe4;--blue-dim:rgba(157,191,228,.12);
  --scroll-thumb:rgba(255,255,255,.16);--scroll-thumb-hover:rgba(255,255,255,.28);
  --lv0:#6b7280;--lv1:#6cc4b8;--lv2:#6cc494;--lv3:#d9b25e;--lv4:#c99a4e;--lv5:#e08f92;
  /* 在线状态那三个点：深色主题同样用"降饱和之前"的原值（见上面那段说明 ✓） */
  --st-online:#2dc26b;--st-idle:#efb02a;--st-dnd:#f05a5f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:transparent;min-height:100%}
body{background:transparent;font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;color:var(--tx-1);display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;font-size: calc(14px * var(--bc-fs-scale, 1));line-height:1.55}
#time-capsule{display:none}
.ico{width:20px;height:20px;flex-shrink:0;display:block}
.ico-sm{width:16px;height:16px}
.ico-xs{width:14px;height:14px}
.bc-shell{width:100%;max-width:1140px;position:relative}
/* ⚠️ 这里原有「收起成小胶囊」那整套的两条规则（`.bc-shell.collapsed .bc-app{display:none}` 和
   `.mini-server`）—— 2026-10-14 整套删掉了：面板在插件里**永远展开**（收纳由悬浮球负责），
   留着它只有一个后果：面板挂载的第一帧会先把那枚小胶囊画出来、再被外壳的样式纠正 ⇒ 闪一下 ✗
   （切到设置时闪出世界书版本的收起样子）。别再加回来。 */
.bc-app{display:flex;height:660px;border-radius:10px;overflow:hidden;background:var(--main);border:1px solid var(--line);position:relative}
.channel-sidebar{width:240px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s cubic-bezier(.2,0,0,1);border-right:1px solid var(--line);overflow:hidden;position:relative}
.bc-app.channel-collapsed .channel-sidebar{width:64px}
.bc-app.channel-collapsed .channel-list{display:none}
.bc-app.channel-collapsed .user-info{display:none}
.bc-app.channel-collapsed .user-panel{justify-content:center;padding:8px 0}
.bc-app.channel-collapsed .server-header{padding:0;justify-content:center}
.bc-app.channel-collapsed .server-name{display:none}
.bc-app.channel-collapsed .server-header .arrow{transform:rotate(-90deg)}
.server-header{height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:650;font-size: calc(15px * var(--bc-fs-scale, 1));color:var(--tx-1);cursor:pointer;flex-shrink:0;transition:background-color .12s ease,padding .25s ease;user-select:none}
.server-header:hover{background:var(--hover)}
/* ⚠️ 标题那四个字也**不许折行**（不然「身体监测」会往上蹦 ✗）：
   同一族毛病 —— 展开时名字**立刻**出现，而侧栏还只有 64px 宽（名字 4 个字 ≈ 60px + 右边那个箭头），
   flex 一行放不下 ⇒ 名字折成两行、宽度长够又弹回一行 ⇒ 看起来就是它往上跳 ✗
   ⇒ nowrap + 裁掉；`flex:1;min-width:0` 是让它"可以被裁"，别把箭头挤出侧栏 ✓ */
.server-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-header .arrow{color:var(--tx-3);display:flex;flex-shrink:0;transition:transform .25s cubic-bezier(.2,0,0,1),color .15s ease}
.channel-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 0 8px}
.channel-list::-webkit-scrollbar{width:10px}
.channel-list::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.channel-category{margin-bottom:14px}
/* ⚠️ 分组小标题同理（同一族的"别折行"，见上面 .channel-item 那段说明） */
.category-label{padding:0 16px 6px;font-size: calc(11px * var(--bc-fs-scale, 1));font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-3);white-space:nowrap;overflow:hidden}
/* ⚠️ 文字栏那几行**不许折行**（不然从侧边栏切到文字栏时文字会往上蹦一下 ✗）：
   展开时文字栏是**立刻**出现的，而侧栏宽度要花 .25s 从 64px 长回 240px
   ⇒ 这 .25 秒里「胎儿动态」这种四字会被挤成两三行、宽度长够又弹回一行 ⇒ 看着就是整块往上跳 ✗
   ⇒ nowrap + 超出的裁掉（侧栏本身 overflow:hidden，动画期间就是从左往右一点点露出来 ✓）
   收起时不会有这个过程（文字栏是瞬间隐藏的）✓ */
.channel-item{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:1px 8px;border-radius:6px;color:var(--tx-2);font-size: calc(14.5px * var(--bc-fs-scale, 1));font-weight:500;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;transition:background-color .1s ease,color .1s ease}
.channel-item:hover{background:var(--hover);color:var(--tx-1)}
.channel-item.active{background:var(--active);color:var(--tx-1);font-weight:600}
.channel-item .hash{color:var(--tx-3);flex-shrink:0;display:flex}
.channel-icons{display:none;flex-direction:column;align-items:center;gap:4px;padding:12px 0 8px;flex:1;overflow-y:auto}
.channel-icons::-webkit-scrollbar{width:0}
.bc-app.channel-collapsed .channel-icons{display:flex}
.channel-icon-btn{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--tx-2);background:transparent;border:1px solid transparent;transition:border-radius .18s cubic-bezier(.2,0,0,1),background-color .15s ease,color .15s ease,transform .18s ease,border-color .15s ease}
.channel-icon-btn:hover{border-radius:50%;background:var(--blurple-dim);color:var(--blurple);border-color:var(--blurple)}
.channel-icon-btn.active{border-radius:50%;background:var(--blurple);color:#fff;border-color:var(--blurple)}
.channel-icon-btn svg{width:20px;height:20px}
.channel-icon-btn.fetus.active{background:linear-gradient(135deg,#ec5b9a,#e5487a);border-color:#ec5b9a}
.channel-icon-btn.astro.active{background:linear-gradient(135deg,#8b5cf6,#c9922c);border-color:#8b5cf6}
.channel-icon-btn.music.active{background:linear-gradient(135deg,#14b8a6,#0891b2);border-color:#14b8a6}
.channel-icon-btn.notes.active{background:linear-gradient(135deg,#e5a41f,#c9922c);border-color:#e5a41f}
.channel-icon-btn.period.active{background:linear-gradient(135deg,#ec5b9a,#e5487a);border-color:#ec5b9a}
.channel-icon-btn.xray.active{background:linear-gradient(135deg,#3aa6c9,#5a65f0);border-color:#3aa6c9}
.channel-icon-divider{width:24px;height:1px;background:var(--line);margin:2px 0;flex-shrink:0}
.user-panel{min-height:62px;padding:8px 10px;background:var(--surface-3);display:flex;align-items:center;gap:10px;flex-shrink:0;border-top:1px solid var(--line);cursor:pointer;position:relative}
.user-panel:hover{background:var(--hover)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#5a65f0,#8a6cf5);color:#fff;display:flex;align-items:center;justify-content:center;font-size: calc(13px * var(--bc-fs-scale, 1));font-weight:700;flex-shrink:0;position:relative;letter-spacing:0}
.user-avatar .avatar-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0}
.user-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;z-index:1;display:block}
.user-avatar.masked{background:#000!important}
.user-avatar.masked img{display:none!important}
.user-avatar.masked .avatar-letter{display:none!important}
.user-avatar.masked .status-dot{display:none!important}
/* ⚠️ 在线状态这几个点走 `--st-*`（**不跟皮肤降饱和** ✓）——
   同族的还有下面 `.user-menu-item .dot.*` ✓ */
.status-dot{position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--st-online);box-shadow:0 0 0 3px var(--surface-3);z-index:3}
.status-dot.online{background:var(--st-online)}
.status-dot.idle{background:var(--st-idle)}
.status-dot.idle::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.status-dot.dnd{background:var(--st-dnd)}
.status-dot.dnd::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:2px;transform:translateY(-50%);background:#fff;border-radius:1px}
.status-dot.invisible{display:none}
.user-info{flex:1;min-width:0;overflow:hidden}
.user-name{font-size: calc(13px * var(--bc-fs-scale, 1));font-weight:650;color:var(--tx-1);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-sign{font-size: calc(11.5px * var(--bc-fs-scale, 1));color:var(--tx-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;margin-top:1px}
.user-menu{position:absolute;bottom:calc(100% + 6px);left:8px;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.25);padding:6px;display:none;z-index:50}
.bc-app.channel-collapsed .user-menu{left:calc(100% + 8px);bottom:8px}
.user-menu.show{display:block}
.user-menu-section{padding:6px 0}
.user-menu-label{padding:4px 10px 6px;font-size: calc(10.5px * var(--bc-fs-scale, 1));font-weight:700;letter-spacing:.06em;color:var(--tx-3);text-transform:uppercase}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--tx-1);font-size: calc(13.5px * var(--bc-fs-scale, 1));font-weight:500;transition:background-color .1s ease}
.user-menu-item:hover{background:var(--hover)}
.user-menu-item .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;position:relative}
.user-menu-item .dot.online{background:var(--st-online)}
.user-menu-item .dot.idle{background:var(--st-idle)}
.user-menu-item .dot.idle::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--surface)}
.user-menu-item .dot.dnd{background:var(--st-dnd)}
.user-menu-item .dot.dnd::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:2px;transform:translateY(-50%);background:#fff;border-radius:1px}
.user-menu-item .dot.invisible{background:transparent;border:2px solid var(--tx-3)}
.user-menu-item .check{margin-left:auto;color:var(--blurple);display:none}
.user-menu-item.selected .check{display:flex}
.user-menu-item.selected{font-weight:600}
.user-menu-divider{height:1px;background:var(--line);margin:4px 6px}
.user-menu-item .mi-icon{width:16px;height:16px;color:var(--tx-3);flex-shrink:0;display:flex}
.user-menu-item .mi-icon svg{width:16px;height:16px}
.main-area{flex:1;min-width:0;background:var(--main);display:flex;flex-direction:column}
.top-bar{height:50px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0}
.top-bar .channel-name{display:flex;align-items:center;gap:8px;font-weight:650;font-size: calc(15px * var(--bc-fs-scale, 1));color:var(--tx-1)}
.top-bar .channel-name .hash{color:var(--tx-3);display:flex}
.top-bar .right{display:flex;align-items:center;gap:10px}
.top-time{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:var(--surface-2);font-size: calc(12px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-2);border:1px solid var(--line);white-space:nowrap}
/* ★ 兜底（2026-10-31）：万一时间那一格还是长了一截，**用省略号收尾**，
   不要像原来那样被右边硬切掉（看不出被切了 ✗） */
.top-time{max-width:100%;min-width:0}
.top-time #topTimeValue{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-time .ico-xs{color:var(--tx-3)}
.top-actions{display:flex;gap:4px;align-items:center;color:var(--tx-3)}
.top-action-btn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx-3);transition:background-color .12s ease,color .12s ease}
.top-action-btn:hover{background:var(--hover);color:var(--tx-1)}
/* 面板里这颗「关闭」只在手机形态露出来：桌面上外壳顶栏已经有 ✕ 了，多一个会重复 ✓ */
#btnClosePanel{display:none}
.top-action-btn.masked{background:var(--red);color:#fff}
.top-action-btn.masked:hover{background:#c93a3f;color:#fff}
.channel-topic{padding:9px 18px;border-bottom:1px solid var(--line);font-size: calc(13px * var(--bc-fs-scale, 1));color:var(--tx-2);display:flex;align-items:center;gap:10px;flex-shrink:0}
.channel-topic .phase-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 3px;border-radius:999px;background:var(--blurple-dim);color:var(--blurple);font-size: calc(11px * var(--bc-fs-scale, 1));font-weight:700}
.channel-topic .phase-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.channel-topic .sub{color:var(--tx-3);font-weight:500}
/* 顶上留白不能太多 ——
   ⚠️ 写死 20px（不属于任何档位）+ 下面每块自己还有 8px ⇒ 频道一打开就先白一块 ✗
   ⇒ 收到档位表的「块与块」那档（10px），所有频道一起挪 ✓ */
.message-scroll{flex:1;overflow-y:auto;padding:10px 0 12px}
.message-scroll::-webkit-scrollbar{width:10px}
.message-scroll::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.view-panel{display:none}
.view-panel.active{display:block;animation:viewFade .2s cubic-bezier(.2,0,0,1)}
@keyframes viewFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg-block{margin:0 0 2px;padding:8px 18px 12px;transition:background-color .1s ease}
.msg-block:hover{background:var(--hover)}
/* ⚠️ **"单独一个功能"的整块不要留悬停高亮（灰）** ——
   那条灰色悬停是"聊天楼"的样式（提示"这块能点"），番茄钟 / 「透视」这种整块不可点的
   套上去就只是划上去变一层灰、很突兀 ✗
   （番茄钟自己带 `bc-timer-block`，见 renderTimer ✓）
   ⚠️ 以后凡是给"单独一个功能的整页/整块"套 `.msg-block`，都要在这里补一条透明悬停 ✗ */
.msg-block.bc-timer-block:hover{background:transparent}
.msg-block.stage-block:hover{background:transparent}

.zone-pill[data-lv="1"] .pv{color:var(--lv1)}
.zone-pill[data-lv="2"] .pv{color:var(--lv2)}
.zone-pill[data-lv="3"] .pv{color:var(--lv3)}
.zone-pill[data-lv="4"] .pv{color:var(--lv4)}

/* 性别标签：和 .child-badge 同一套「实心药丸」语言。

.child-attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px}
/* 子嗣卡按性别给左侧色条 —— 不读标签也能一眼分出男女 */
.child-card.male{border-left-color:var(--blue)}
.child-card.female{border-left-color:var(--pink)}
.child-card.male{background:linear-gradient(180deg,var(--blue-dim),var(--surface-2))}
.child-card.female{background:linear-gradient(180deg,var(--pink-dim),var(--surface-2))}
.attr-row{display:flex;align-items:baseline;gap:10px;font-size: calc(13.5px * var(--bc-fs-scale, 1));line-height:1.55;min-width:0}
.attr-key{flex-shrink:0;font-size: calc(10.5px * var(--bc-fs-scale, 1));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);min-width:56px}
.attr-val{color:var(--tx-1);font-weight:500;word-break:break-word;min-width:0}
.trait-chips{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
/* ★ 2026-10-24：显性/隐性可能很长，别再做成一颗横向药丸（会溢出/截断）⇒ 整行、可换行 ✓ */
.trait-chip{display:flex;align-items:flex-start;gap:6px;padding:6px 10px;border-radius:10px;font-size: calc(11.5px * var(--bc-fs-scale, 1));font-weight:500;background:var(--purple-dim);color:var(--purple);white-space:normal;word-break:break-word;line-height:1.5;max-width:100%}
.trait-chip .chip-k{font-size: calc(9px * var(--bc-fs-scale, 1));font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.7}
.trait-chip.recessive{background:var(--surface-3);color:var(--tx-2)}
/* ★ 2026-10-24：天赋（职业 / 身份 / 训练出来的东西）单独一颗，跟显性、隐性区分开 */
.trait-chip.talent{background:transparent;border:1px dashed var(--line);color:var(--tx-2)}
/* ★ 2026-10-24：天赋强度单独一行（跟天赋内容分开，别挤进同一颗标签） */
.trait-strength{margin-top:2px;padding-left:9px;border-left:2px dashed var(--line);font-size:calc(11.5px * var(--bc-fs-scale, 1));line-height:1.6;color:var(--tx-2)}
.divination-card{padding:16px;background:linear-gradient(180deg,var(--purple-dim),var(--surface-2));border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--purple);position:relative;overflow:hidden}
.divination-card::before{content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--purple-dim),transparent 70%);opacity:.7;pointer-events:none}
.div-section{margin-bottom:12px;position:relative}
.div-section-label{font-size: calc(10.5px * var(--bc-fs-scale, 1));font-weight:800;letter-spacing:.08em;color:var(--tx-3);text-transform:uppercase;margin-bottom:6px}
.factor-list{display:flex;flex-direction:column;gap:2px}
.factor-row{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-radius:6px;font-size: calc(13.5px * var(--bc-fs-scale, 1))}
.factor-row:nth-child(odd){background:rgba(0,0,0,.025)}
[data-theme="dark"] .factor-row:nth-child(odd){background:rgba(255,255,255,.025)}
.factor-name{color:var(--tx-1);font-weight:500}
.factor-value{color:var(--purple);font-weight:700;font-size: calc(13px * var(--bc-fs-scale, 1));font-variant-numeric:tabular-nums}
.div-divider{height:1px;background:var(--line);margin:12px 0;position:relative}
.div-divider::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:var(--purple);opacity:.4}
.result-row{display:flex;align-items:baseline;justify-content:space-between;padding:4px 0;position:relative}
.result-label{font-size: calc(12px * var(--bc-fs-scale, 1));font-weight:700;letter-spacing:.04em;color:var(--tx-3);text-transform:uppercase}
.result-value{font-size: calc(18px * var(--bc-fs-scale, 1));font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.result-value.final{font-size: calc(24px * var(--bc-fs-scale, 1));color:var(--purple)}
.result-cap{font-size: calc(11px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-3);margin-left:8px}
.outcome-list{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.outcome-line{display:flex;align-items:flex-start;gap:8px;font-size: calc(13.5px * var(--bc-fs-scale, 1));line-height:1.65;color:var(--tx-2)}
.outcome-line .emoji{flex-shrink:0;color:var(--gold);font-size: calc(15px * var(--bc-fs-scale, 1));line-height:1.4}
.modal-overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(10,12,18,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:var(--surface);color:var(--tx-1);width:100%;max-width:600px;max-height:88vh;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-weight:650;font-size: calc(15px * var(--bc-fs-scale, 1));display:flex;align-items:center;gap:10px}
.modal-title .ico{color:var(--blurple)}
.modal-close{cursor:pointer;color:var(--tx-3);padding:4px;border-radius:6px;display:flex}
.modal-close:hover{color:var(--tx-1);background:var(--hover)}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:10px}
.modal-body::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
.row-flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.row-flex > span{font-size: calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3);font-weight:600}
.floor-input{width:86px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--tx-1);font-family:inherit;font-size: calc(13px * var(--bc-fs-scale, 1));outline:none;font-weight:500}
.floor-input:focus{border-color:var(--blurple)}
.mini-btn{background:var(--blurple);color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size: calc(13px * var(--bc-fs-scale, 1));font-weight:600;font-family:inherit}
.action-row{display:flex;gap:10px;margin-top:16px}
/* ⚠️ 左右内边距不能是 0（`padding:11px 0`）⇒ 文字紧贴按钮边框，
   字体一放大（易读模式 ×1.3）看着就像"容器太小、字溢出" ✗
   ⇒ 左右各留 18px、最小高度 42px（大字模式下不挤）✓
   `.action-row` 里两颗平分那一套照旧（flex:1 没动 ✓） */
.primary-btn,.ghost-btn{flex:1;padding:11px 18px;min-height:42px;border:none;border-radius:8px;font-weight:650;font-size: calc(13.5px * var(--bc-fs-scale, 1));cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
/* 单独摆在空状态里的那种按钮（比如「打开时光机」）：不许比文字还窄、也不许被压扁 ✗ */
.empty-state .primary-btn,.empty-state .ghost-btn{flex:0 0 auto;min-width:max-content;padding:12px 22px}
.primary-btn{background:var(--blurple);color:#fff}
.primary-btn:hover{background:var(--blurple-2)}
.ghost-btn{background:var(--surface-2);color:var(--tx-2);border:1px solid var(--line)}
.ghost-btn:hover{background:var(--hover);color:var(--tx-1)}
.theme-toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:var(--tx-1);color:var(--main);padding:9px 22px;border-radius:8px;font-size: calc(13px * var(--bc-fs-scale, 1));font-weight:600;opacity:0;pointer-events:none;z-index:1000;transition:opacity .25s ease,transform .25s ease}
.theme-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.empty-state{padding:64px 20px;text-align:center;color:var(--tx-3);font-size: calc(13.5px * var(--bc-fs-scale, 1));font-weight:500;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state svg{width:32px;height:32px;color:var(--tx-4);display:block}
/* ═══════════════════════════════════════════════════════════════
   阶段插图：由「透视」这个 BOT 发
   · 一次只显示**一张**（是插画，不是窄长的指示灯 ✓）
   · 没图的时候显示**文字版**，尺寸一模一样 ⇒ 图到了不会跳版 ✓
   · 它整块是个普通消息块 ⇒ 左右留白由 .msg-block 给，这里不再加 margin ✓
   ═══════════════════════════════════════════════════════════════ */
/* 比例是 **4:3** ——
   16:9 那块太扁，竖着的构图（子宫那种）在里面很憋屈；4:3 是"方一点、又不至于占掉半屏"的中间点。
   ⇒ 画布是 **1200×900**（4:3）✓
   ⚠️ 改这里要跟三处一起看：① 设置页那张缩略图（`style.css` 的 `.bc-stage-preview` 也是 4:3）；
   ② 设置页「？」里的尺寸说明；③ 没图时的文字版（它跟图共用这个类，比例自动跟着走 ✓） */
/* ⚠️ 只写 `width:100% + 4:3` 会让**面板越宽它越高**（面板 900 宽时它 675 高）✗ ⇒
   要往下划很多才能到底 ⇒ 必须给它**一个高度上限**：用 `max-width` 反压
   （`52vh × 4/3` ≈ 高度 ≤ 52% 可见高度），**比例仍然是 4:3**（构图一点不裁 ✓），
   超了就变窄、居中 ✓
   ⚠️ 只压宽度、**不写 `max-height`** —— 写 `max-height` 会把 4:3 压扁（盒子比例变了 ⇒ 叠层会被裁）✗
   ⚠️ 想调大小就改这一个数（`52vh`）：调大 = 图更大，调小 = 更矮 ✓ */
.stage-art{position:relative;width:100%;max-width:calc(52vh * 4 / 3);margin-left:auto;margin-right:auto;
  aspect-ratio:4/3;border-radius:12px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center;padding:0 18px}
.stage-art img{width:100%;height:100%;object-fit:cover;display:block}
/* 分层合成：底图 + 叠加层都是同一张 1200×900 画布 ⇒ **直接叠、不用定位** ✓
   （一张一张绝对定位盖上去即可 ✓） */
.stage-art-stack img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.stage-art-text .stage-big{font-size:calc(16px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-2)}
.stage-art-text .stage-line{font-size:calc(12.5px * var(--bc-fs-scale, 1));font-weight:500;color:var(--tx-3);line-height:1.7}
/* 「透视」频道 —— 一整页只画一张 ⇒ 图用上整个面板高度 ✓
   ⚠️ 上限写成 `min(100vh - 220px, 560px)`，**不能只写 vh**：桌面面板本身高度有上限（660px），
     只按 vh 算的话窗口一高就会算得比面板还大 ⇒ 又变成要往下滑 ✗
   ⚠️ 仍然只压**宽度**（写 max-height 会把 4:3 压扁、叠加层会被裁 ✗）
   ⚠️⚠️ `.stage-page` 用 `align-items:center` 会让图变得很小：`.stage-page` 用了 `align-items:center`，
     而**列方向 flex 的 `center` 会把子项的宽度变成"按内容收缩"**（默认的 `stretch` 被覆盖掉 ✗）
     ⇒ 里面那块 `.msg-block` 缩成图片自身的尺寸 ⇒ 上面那些 max-width 上限根本轮不到生效 ✗
     ⇒ 给里面的块**显式 `width:100%`** ✓（下面的 max-width 才有东西可压 ✓）*/
/* ⚠️ 图上面与图**下面**两处留白要对称：
   原样不对称的原因：图上面只有 `.block-head` 的 8px 外边距；图下面却叠了
   `.msg-block` 的 12px 下内边距 ＋ `.stage-page` 的 22px 下内边距 = 34px ✗
   ⇒ 把这一页的间距**全部显式定成同一个数（16px）**：页面不带上下内边距，
     块自己的上/下内边距相等、头到图的外边距也等于它 ✓（外面那圈留白交给居中 ✓）*/
.stage-page{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px}
/* ⚠️⚠️ `.stage-page` 高度不能是 auto（= 内容高）⇒ `justify-content:center`
   根本没东西可居中 ⇒ 多出来的高度**全掉在下面**（实测：图上 16px、图下 98px ✗）
   ⇒ 让它**占满可见区**，居中才真的生效（上下空白自动相等 ✓）*/
.view-panel[data-panel="stage"]{height:100%}
.stage-page{height:100%;box-sizing:border-box}
.stage-page .stage-art{cursor:zoom-in}        /* 点一下看大图（不加 cursor 就看不出能点 ✗） */
.stage-page .msg-block{width:100%;padding:16px 18px}
.stage-page .block-head{margin-bottom:16px}
/* ⚠️⚠️ **`100vh` 是窗口高度，不是面板高度** ✗ —— 面板本体是固定 660（手机上才是 100dvh），
   所以在"窗口比面板高"的时候按 vh 算出来的图**比面板还高** ⇒ 那一页整体溢出、
   顶上的头像被切掉 ✗✗
   ⇒ 正解：拿**滚动容器自己的高度**当尺子（`cqh`，见下面 `@supports` 那段）✓
   兜底保留 vh 那版（老值 220，实测在 660 面板下不会溢出 ✓）*/
.stage-page .stage-art-big{max-width:min(100%, calc((100vh - 220px) * 4 / 3))}
/* 支持容器查询时用**真实可用高度**：滚动容器内容高 − 块上下内边距(32) − 头(36) − 一点余量(12) ✓
   （`.message-scroll` 是"撑满剩余空间"的滚动容器 ⇒ 它的高度就是这一页真正能用的高度 ✓）*/
@supports (container-type: size) {
    .message-scroll { container-type: size; }
    .stage-page .stage-art-big { max-width:min(100%, calc((100cqh - 80px) * 4 / 3)); }
}
.stage-cap{margin-top:8px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
/* ★ 2026-10-24：图下面补一行文字读数（孕期图上看不见子宫里的精液量）✓ */
.stage-loads{margin-top:6px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--tx-2)}
.stage-loads b{color:var(--tx-1);font-weight:inherit}
.stage-name{font-size:calc(14px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-1)}
.stage-capline{font-size:calc(12.5px * var(--bc-fs-scale, 1));color:var(--tx-3)}
/* 「成就」频道：按聊天记，只显示这个聊天解锁过的 */.ach-head{padding:18px 18px 6px}
/* 「日历」频道：格子是**外壳算好拼过来的**，这里只管长相 ✓
     ⚠️ 风格必须对齐面板现有规矩（不然"有点怪怪的、不是完全符合我们的 UI 样子" ✗）：
     主色走 --blurple、卡片走 surface-2 + line 边框、头部照「成就」页那种
     「一句大读数 ＋ 一行小字」（.ach-title / .ach-sub 同款字号）✓ */
/* 设备真实时间——**只在"非聊天页面"显示** ✓
   聊天里不显示（概览页本来就有剧情时间 `topTime` ✓ ⇒ 聊天页不需要，概览有就够了）
   ⚠️ `bc-notes-outside-chat` 这个类＝**不在聊天页**（跟"有没有正文"那个类区分开 ✓） */
.top-clock{display:none;order:9;margin-left:auto;padding-right:4px;font-size:calc(12.5px * var(--bc-fs-scale, 1));color:var(--tx-3);font-variant-numeric:tabular-nums;white-space:nowrap}
html.bc-notes-outside-chat .top-clock{display:inline-flex;align-items:center}
/* ⚠️ 兜底：两条"不在聊天"的信号**都认** ✓
   （`bc-notes-outside-chat`＝不在聊天页 / `bc-outside-chat`＝聊天里还没正文 ⇒ 两条都算"外面" ✓）
   另外那行小脚本还会**自己设一次 inline display**（inline 优先级最高 ⇒ 这一段万一不生效也不影响 ✓）
   ⚠️ 位置要放到**那排图标的最右边**，不是它的左边 ✗
      ⇒ 用 `order:9`（这一排是 flex ⇒ 排到最后）＋ `margin-left:auto`（不是 flex 时也能往右顶一把）✓ */
html.bc-outside-chat .top-clock{display:inline-flex;align-items:center}
.bc-cal-wrap{padding:0 0 20px}
.bc-cal-head{display:flex;align-items:flex-start;gap:8px;padding:18px 18px 10px}
.bc-cal-hd-main{min-width:0}
.bc-cal-title{font-size:calc(20px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-1);font-variant-numeric:tabular-nums}
.bc-cal-jump{cursor:pointer}
.bc-cal-jump:hover{color:var(--blurple)}
.bc-cal-today{flex:0 0 auto;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:calc(12px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-3);background:transparent;border:1px solid var(--line);white-space:nowrap;transition:.15s}
.bc-cal-today:hover{border-color:var(--blurple);color:var(--blurple)}
.bc-cal-sub{margin-top:4px;font-size:calc(12.5px * var(--bc-fs-scale, 1));color:var(--tx-3);display:flex;flex-wrap:wrap;align-items:center}
.bc-cal-mode{display:inline-flex;align-items:center;cursor:pointer;padding:2px 10px 3px;border-radius:999px;font-size:calc(11.5px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-3);border:1px solid var(--line);margin-right:6px}
.bc-cal-mode:hover{border-color:var(--blurple);color:var(--blurple)}
.bc-cal-mode.on{background:var(--blurple-dim);border-color:var(--blurple);color:var(--blurple)}
.bc-cal-sub-tx{margin-left:2px}
/* 跨月视图（不然圈日子看月头月尾不方便）：连着的几个月竖着滚 ✓ */
.bc-cal-scroll{max-height:62vh;overflow-y:auto;padding-bottom:4px}
.bc-cal-sec{margin-top:14px}
.bc-cal-sec:first-child{margin-top:0}
.bc-cal-sec-title{padding:0 18px 6px;font-size:calc(12.5px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-2)}
.bc-cal-sec .bc-cal-grid{padding-top:0}
.bc-cal-sp{flex:1 1 auto}
.bc-cal-nav{flex:0 0 auto;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--blurple);background:var(--blurple-dim);border:1px solid transparent;font-size:calc(17px * var(--bc-fs-scale, 1));line-height:1;transition:.15s}
.bc-cal-nav:hover{background:var(--blurple);color:#fff}
.bc-cal-hol{flex:0 0 auto;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:calc(12px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-3);background:transparent;border:1px solid var(--line);white-space:nowrap;transition:.15s}
.bc-cal-hol:hover{border-color:var(--blurple);color:var(--blurple)}
.bc-cal-hol.on{background:var(--blurple-dim);border-color:var(--blurple);color:var(--blurple)}
.bc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto;grid-auto-rows:1fr;gap:4px;padding:8px 18px 0}
.bc-cal-cell{height:62px;border-radius:9px;padding:3px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;transition:border-color .12s ease}
.bc-cal-wd{font-size:calc(10.5px * var(--bc-fs-scale, 1));color:var(--tx-3);text-align:center;padding:0 0 4px}
.bc-cal-cell:hover{border-color:var(--blurple)}
.bc-cal-cell.bc-cal-pad{background:transparent;border-color:transparent;cursor:default;opacity:.45}
.bc-cal-d{font-size:calc(12.5px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-2);font-variant-numeric:tabular-nums}
.bc-cal-h{font-size:calc(9.5px * var(--bc-fs-scale, 1));color:var(--tx-3);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-cal-u{font-size:calc(9.5px * var(--bc-fs-scale, 1));color:var(--tx-3);margin-top:1px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-cal-n{font-size:calc(9.5px * var(--bc-fs-scale, 1));color:var(--red);margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ★ 预产期（2026-10-26）：插件自己算的、**常驻**在那一格上 ✓
   口径：绿色系（跟日程的红圈分开）＋ 文字写「预产期」；同一天多胎写「预产期 2 胎」
   ⚠️ 有日程那天本来就有红圈 ⇒ 绿圈只加在"没有红圈"的格子上，不然两个 box-shadow 打架 ✗ */
.bc-cal-due{font-size:calc(9.5px * var(--bc-fs-scale, 1));color:var(--green);font-weight:700;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-cal-cell.bc-cal-hasdue:not(.bc-cal-mark){box-shadow:inset 0 0 0 2px var(--green)}
/* 下半部分那行"谁的预产期、还有几天 / 已过几天"（只读，不是日程 ✓） */
.bc-cal-duenote{padding:7px 0 0;font-size:calc(12px * var(--bc-fs-scale, 1));line-height:1.75;color:var(--green);font-weight:600}
/* 头部那颗「跳到预产期」（跟「今天」同款，用绿色区分 ✓） */
.bc-cal-duejump{flex:0 0 auto;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:calc(12px * var(--bc-fs-scale, 1));font-weight:600;color:var(--green);background:transparent;border:1px solid var(--green);white-space:nowrap;transition:.15s}

.bc-cal-on{background:var(--blurple-dim);border-color:var(--blurple)}

.bc-cal-mark{box-shadow:inset 0 0 0 2px var(--red)}
.bc-cal-alert{display:flex;align-items:flex-start;gap:10px;margin:14px 18px 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--red)}
.bc-cal-al-text{flex:1 1 auto;min-width:0;font-size:calc(12.5px * var(--bc-fs-scale, 1));line-height:1.75;color:var(--tx-2)}

.bc-cal-al-when{margin-left:6px;color:var(--tx-3)}
.bc-cal-al-x{flex:0 0 auto;cursor:pointer;color:var(--tx-3);padding:0 4px}
.bc-cal-al-x:hover{color:var(--red)}
.bc-cal-foot{padding:12px 18px 0;font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3);line-height:1.8}
/* 日历下半部分：点中的那天就地编辑（日程塞默认视图的下半部分 ✓） */
.bc-cal-cell.bc-cal-sel{outline:2px solid var(--blurple);outline-offset:-2px}
.bc-cal-day{margin-top:10px;padding:12px 18px 0;border-top:1px solid var(--line)}
.bc-cal-day-head{display:flex;align-items:center;gap:8px}
.bc-cal-day-d{font-size:calc(13px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-1);font-variant-numeric:tabular-nums}
.bc-cal-day-c{font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3)}
.bc-cal-day-add{flex:0 0 auto;cursor:pointer;padding:5px 12px;border-radius:999px;font-size:calc(12px * var(--bc-fs-scale, 1));font-weight:600;color:var(--tx-3);border:1px solid var(--line);white-space:nowrap;transition:.15s}
.bc-cal-day-add:hover{border-color:var(--blurple);color:var(--blurple)}
/* 面板自己的输入弹窗（⚠️ 不用 window.prompt：安卓 WebView 里可能静默返回空 ✗） */
.bc-in-overlay{position:fixed;inset:0;z-index:32000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.38)}
.bc-in-box{width:min(360px,88vw);padding:14px 15px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 16px 44px rgba(0,0,0,.4)}
.bc-in-title{font-size:calc(13.5px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-1);margin-bottom:9px}
.bc-in-input{width:100%;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--tx-1);font-family:inherit;font-size:calc(13px * var(--bc-fs-scale, 1));outline:none}
.bc-in-input:focus{border-color:var(--blurple)}
/* 确认框的正文（跟上面那套同一个弹窗壳 ✓）；pre-wrap 是给它带换行的提示用的 ✓ */
.bc-in-text{font-size:calc(13px * var(--bc-fs-scale, 1));color:var(--tx-1);line-height:1.8;white-space:pre-wrap;word-break:break-word}

@media (max-width:560px){.bc-in-foot button{min-height:44px}.bc-in-input{min-height:44px;font-size:calc(14px * var(--bc-fs-scale, 1))}}

/* 下半部分**固定一个高度上限、多了在里面滚** ⇒ 上面的格子不跟着跳 ✓ */
.bc-cal-day-list{margin-top:10px;max-height:34vh;overflow-y:auto}
/* ⚠️ 那个大长条**太奇怪**了，不要铺这么满 ✗

.bc-cal-ev-all:hover{border-color:var(--blurple);color:var(--blurple)}
.bc-cal-ev-all.on{background:var(--blurple-dim);border-color:var(--blurple);color:var(--blurple)}
/* 每条自己的「提醒」两档（**不应该做成一个按钮，做成两个** ✓）：

.bc-timer-card{display:flex;flex-direction:column;align-items:center}

.bc-timer-row-center{justify-content:center}
.bc-timer-sep{width:100%;height:1px;background:var(--line);margin:14px 0 0}
.bc-timer-label{font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3);font-weight:600;margin:12px 0 0;align-self:flex-start}
.bc-timer-warn{font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--yellow);margin:10px 0 0;line-height:1.7;padding:0 18px}
.bc-timer-stats{font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3);margin:14px 0 0;line-height:1.8;text-align:center}
.bc-timer-mins{width:96px;padding:5px 8px;font-size:calc(13px * var(--bc-fs-scale, 1));border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--tx-1);font-variant-numeric:tabular-nums;text-align:center}
/* ⚠️ 那两行字（默认 / 今天完成）**不能居中**：它是一整句说明，居中之后折行读着很乱 ⇒ 靠左 ✓ */
.bc-timer-stats{font-size:calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3);margin:14px 0 0;line-height:1.8;text-align:left;align-self:stretch}
.bc-timer-mini{padding:5px 12px;border-radius:999px;font-size:calc(12.5px * var(--bc-fs-scale, 1));font-weight:600;cursor:pointer;color:var(--tx-2);border:1px solid var(--line);white-space:nowrap;transition:.15s}
.bc-timer-mini:hover{border-color:var(--blurple);color:var(--blurple)}

.bc-cal-ev-clock,.bc-cal-ev-note,.bc-cal-ev-title{border:1px solid var(--line);border-radius:8px;background:var(--surface-3);color:var(--tx-1);font-family:inherit;font-size:calc(12.5px * var(--bc-fs-scale, 1));outline:none;min-width:0}

.bc-cal-ev-tilde{color:var(--tx-3);font-size:calc(11.5px * var(--bc-fs-scale, 1))}
.bc-cal-ev-note,.bc-cal-ev-title{width:100%;margin-top:5px;padding:5px 8px}
.bc-cal-ev-title{font-weight:600}

.bc-cal-ev-warn{font-size:calc(11px * var(--bc-fs-scale, 1));color:var(--yellow);line-height:1.6}
.bc-cal-ev-warn:empty{display:none}
@media (max-width:560px){.bc-cal-head{padding:14px 14px 8px}.bc-cal-grid{gap:3px;padding:6px 14px 0}.bc-cal-cell{min-height:40px;padding:3px}.bc-cal-alert{margin:12px 14px 0}.bc-cal-foot{padding:10px 14px 0}.bc-cal-day{padding:10px 14px 0}.bc-cal-day-list{max-height:30vh}.bc-cal-ev-list{grid-template-columns:1fr}}.ach-count{font-size:calc(20px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-1)}

.ach-scope{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.ach-scope-btn.active{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-tx);font-weight:600}

/* 触发依据 = 客观事实，用左竖条跟吐槽区分开（不靠降透明度 ✓） */

.child-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}

.player-card{padding:16px 18px;background:linear-gradient(135deg,var(--surface-2),var(--main));border:1px solid var(--line);border-radius:12px;border-left:4px solid var(--cyan);margin-top:4px}

.notes-export-btn svg{width:14px;height:14px;display:block}

.note-time-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--surface-3);font-size: calc(10.5px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-3);letter-spacing:.02em}

@media (max-width:640px){

  /* ⚠️ 这里原来还有个 `max-height:700px`：560~640 那一档（iframe 有 800 多高时）
     它会在面板底下留一百来像素空白（2026-10-31 她缩窗口时看到的）✗
     ⇒ 去掉上限，高度跟着 iframe 走；外壳那边本来就有自己的高度上限，不会无限长 ✓ */
  .bc-app{height:calc(100vh - 24px);border-radius:8px}
  .channel-sidebar{width:180px}
  .bc-app.channel-collapsed .channel-sidebar{width:56px}

/* ═══════════════════════════════════════════════════════════════════════════
   手机版（整屏）—— 手机酒馆用户也要能用

   三条规矩，改这块之前先看：
   ① **按可用宽度切形态，不认 UA**，判据是
      `(max-width: 560px), (hover: none) and (max-height: 520px)`：
        · 窄屏 ＝ 竖着拿的手机；桌面把窗口拖窄也会自动变手机形态 ✓
        · 触屏 ＋ 矮屏 ＝ **横着拿的手机**（横过来 800 多宽，只看宽度会被当成平板，
          可高度只剩 88vh 那点，两栏根本塞不下 ✗）
        · 带 `hover:none` 就不会误伤桌面：鼠标设备把窗口拉矮也不命中 ✓
      ⚠️ 这个字符串和外壳（style.css / src/ui.js）里那两处**必须逐字相同**
  ② **侧栏不常驻 ⇒ 改成「抽屉」**：默认收在屏幕左边外面，顶栏那颗按钮把它拉出来。
      动画只动 `transform`（GPU 合成），不动 `width`：手机上 width 动画每帧都要重排，会掉帧 ✗
   ③ 手机形态下"收起成图标栏"那套没有意义（抽屉里就该是文字列表）⇒ 把 `channel-collapsed` 反掉 ✓

   为什么阈值定 560：常见手机竖屏 360~430px，加上 94vw 的悬浮窗 ≈ 340~405px；
   560 以上（平板竖屏 / 桌面窗口）留两栏还放得下 ✓
   ═══════════════════════════════════════════════════════════════════════════ */
.bc-drawer-btn{display:none;width:38px;height:38px;border-radius:8px;flex-shrink:0;align-items:center;justify-content:center;color:var(--tx-2);cursor:pointer;transition:background-color .12s ease}
.bc-drawer-mask{display:none;position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s ease}
@media (max-width: 560px), (hover: none) and (max-height: 520px){
  body{padding:0}
  .bc-shell{max-width:none}
  /* 100dvh：地址栏收放时 vh 会跳（手机上看着就是面板整个抖一下）✗
     ★ 手机上的安全区一律写成「两用写法」：`var(--tt-inset-*, env(safe-area-inset-*, 0px))`
       —— TauriTavern（TT）在移动端把 `--tt-inset-*` 注进来（同源 iframe 也会桥进来一层），
          酒馆那边没有这个变量 ⇒ 自动退回 `env()` ⇒ 一套 CSS 两边都对，谁都不坏 ✓ */
  .bc-app{height:100vh;height:100dvh;max-height:none;border-radius:0;border:0;padding-bottom:min(env(safe-area-inset-bottom, 0px), 80px)}
  .bc-drawer-btn{display:flex}
  .bc-drawer-mask{display:block}
  /* ⚠️ 遮罩必须 `pointer-events:none` 收着 —— opacity:0 的元素**照样吃点击**，
     忘了这一条手机上整个面板会点不动（看是看不出来的 ✗） */
  .bc-app.drawer-open .bc-drawer-mask{opacity:1;pointer-events:auto}
  /* 抽屉是绝对定位的：父容器的 padding 管不到它 ⇒ 安全区要自己吃一份 ✓
     ⚠️ 那个投影**只在拉开时给**（挂在下面 `.drawer-open` 那条上）：
     抽屉关着是 `translateX(-100%)`，可投影带 24px 模糊 ⇒ 关着的时候屏幕左边会留下
     一条灰边（整屏形态下特别显眼 ✗）*/
  .channel-sidebar{position:absolute;left:0;top:min(env(safe-area-inset-top, 0px), 80px);bottom:min(env(safe-area-inset-bottom, 0px), 80px);width:min(286px,84vw);z-index:20;transform:translateX(-100%);transition:transform .22s cubic-bezier(.2,0,0,1)}
  .bc-app.drawer-open .channel-sidebar{transform:translateX(0);box-shadow:6px 0 24px rgba(0,0,0,.28)}
  /* 抽屉里始终显示文字列表（窄屏反掉"收起成图标栏"） */
  .bc-app.channel-collapsed .channel-sidebar{width:min(286px,84vw)}
  .bc-app.channel-collapsed .channel-list{display:block}
  .bc-app.channel-collapsed .user-info{display:block}
  .bc-app.channel-collapsed .user-panel{justify-content:flex-start;padding:8px 10px}
  .bc-app.channel-collapsed .server-header{padding:0 16px;justify-content:space-between}
  .bc-app.channel-collapsed .server-name{display:block}
  .bc-app.channel-collapsed .channel-icons{display:none}
  .bc-app.channel-collapsed .user-menu{left:8px;bottom:calc(100% + 6px)}
  /* 抽屉的头就是标题（点它 = 收起），那个"折叠成图标栏"的箭头在手机上会误导 ⇒ 藏掉 */
  .server-header .arrow{display:none}
  .channel-item{padding:11px 14px}
  .user-panel{min-height:54px}
  .user-menu{width:min(240px,72vw)}
  /* 顶部条也要吃安全区：TT 的沉浸模式默认开（顶部 inset 归零但仍然要躲刘海）✗
     所以高度改成 auto + min-height，把安全区加到上内边距上 ✓ */
  .top-bar{height:auto;min-height:48px;padding:min(env(safe-area-inset-top, 0px), 80px) 6px 0 2px}
  /* ★ 手机上顶栏是**三块**（☰ / 频道名 / 右边那排按钮），桌面只有两块（频道名 / 右边那排）——
     父级那句 `justify-content:space-between` 在三块时会**把频道名推到正中间**（看着像版块错位 ✗）
     ⇒ 手机这档改成左对齐 + 右边那排用 margin-left:auto 顶到最右，
     频道名就紧挨着 ☰（也就是桌面上井号那个位置）✓ */
  .top-bar{justify-content:flex-start;column-gap:6px}
  .top-bar .right{margin-left:auto}
  /* ★ 手机上也照桌面那样带井号 ——
     原来这档写了 `.hash{display:none}`，那是当年顶栏挤不下才藏的，现在装得下 ✓
     井号是 `<svg>`（display:flex 的 span 包着），要给它一个明确尺寸才画得出来 ✓ */
  .top-bar .channel-name{gap:6px;min-width:0;overflow:hidden}
  .top-bar .channel-name .hash{display:flex;flex:0 0 auto}
  .top-bar .channel-name .hash .ico{width:15px;height:15px}
  #topChannelName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-bar .right{gap:0}
  .top-action-btn{width:36px;height:36px}
  /* 手机形态：外壳顶栏在 TT 上不一定露出来 ⇒ 面板里给一颗「关闭」保底 ✓ */
  #btnClosePanel{display:flex}
  /* 手机上那两颗 −/＋ 再放大一档（太小、判定范围也小 ⇒ 加大一点范围 ✓） */
  .lyric-step{width:38px;height:38px}
  .channel-topic{padding:8px 10px;gap:6px}
  .msg-block{padding:8px 12px 12px}
  .modal-overlay{padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .modal-card{max-width:none;max-height:none;width:100%;height:100%;border-radius:0}
  .search-results{max-height:none}
}

/* ═══════════════════════════════════════════════════════════════════════════
   触屏专属（`@media (hover:none)`）

   触屏没有真正的 hover：手指点一下之后 `:hover` 会**一直粘着**（Android 尤其明显），
   看着就像"这一条被选中了" ✗ ⇒ 那些"悬停才亮"的一律关掉，改用 `:active` 的即时反馈 ✓
   顺手做两件手机上的老毛病：
   ① `-webkit-tap-highlight-color:transparent` 去掉点按那一下灰色块；
   ② 全屏毛玻璃（`backdrop-filter`）在手机 GPU 上很贵 ⇒ 触屏设备直接关掉，底色的半透明留着 ✓
   ⚠️ 这一块只影响触屏设备（桌面鼠标的 hover 一个字没动 ✓）
   ═══════════════════════════════════════════════════════════════════════════ */
@media (hover:none){
  html{-webkit-tap-highlight-color:transparent}
  body{touch-action:manipulation}
  /* 这些"悬停才加深"的底就是 hover 效果 ⇒ 触屏点完会一直亮着，直接关掉 */
  .server-header:hover,.msg-block:hover,.channel-item:hover,.user-menu-item:hover{background:transparent}
  .channel-item:hover{color:var(--tx-2)}
  .channel-item.active:hover{color:var(--tx-1)}
  /* ⚠️ 这两个**自己本来就有底色** ⇒ 不能关成 transparent（那会把卡片底色一起抹掉 ✗）
     只回到"没被悬停"的那个颜色 ✓ */
  .user-panel:hover{background:var(--surface-3)}
  .search-hit:hover{background:var(--surface-2);border-color:transparent}
  .top-action-btn:hover{background:transparent;color:var(--tx-3)}
  .top-action-btn.masked:hover{background:var(--red);color:#fff}
  .channel-item:active,.user-menu-item:active,.top-action-btn:active,.search-hit:active{background:var(--active)}
  .modal-overlay{backdrop-filter:none;-webkit-backdrop-filter:none}
  /* 面板是盖在聊天上的：里面的列表滚到头时**不许把滚动传给后面的聊天**（手机会连页面一起滚）✗ */
  .message-scroll,.channel-list,.search-results{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
}

/* 系统里开了「减弱动态效果」就别做动画（有人会晕动；老机器也顺一点 ✓）
   ⚠️ 用 .01ms 而不是 0：有的浏览器把 0 当"没设"，连 transitionend 都不发 ✗ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- 搜索 ---------- */
.search-results{margin-top:10px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.search-group{font-size: calc(11px * var(--bc-fs-scale, 1));color:var(--tx-3);padding:6px 2px 0;letter-spacing:.04em}
.search-hit{padding:8px 10px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:1px solid transparent}
.search-hit:hover{background:var(--surface-3);border-color:var(--line)}
.search-hit-key{font-size: calc(11px * var(--bc-fs-scale, 1));color:var(--blurple);font-weight:600;margin-bottom:2px}
.search-hit-val{font-size: calc(12px * var(--bc-fs-scale, 1));color:var(--tx-1);line-height:1.6;word-break:break-word}
.search-hit mark{background:var(--blurple-dim);color:var(--blurple);border-radius:3px;padding:0 2px}
.search-empty{text-align:center;color:var(--tx-3);font-size: calc(12px * var(--bc-fs-scale, 1));padding:22px 0}

/* ---------- 侧栏分组可折叠（聊天软件 那种） ---------- */
.category-label{
  display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;
  border-radius:4px;padding:2px 4px !important;margin-left:4px;
  transition:color .12s;
}
.category-label:hover{color:var(--tx-1)}
.category-label .cat-caret{
  display:inline-flex;width:10px;height:10px;flex:0 0 auto;
  transition:transform .15s;opacity:.75;
}
.channel-category.collapsed .cat-caret{transform:rotate(-90deg)}
.channel-category.collapsed .channel-item{display:none}
/* ---- 联系人入口（照聊天软件那个样子做的：纯文字入口，下面配一条分隔线 ✓）
   ⚠️ 规矩：**文字栏纯文字**（图标不许出现在这里 ✗）、**图标只进图标栏** ✓ ---- */
.bc-contact-entry{margin-top:6px}
/* 常驻入口：它不在任何 .channel-category 里 ⇒ 折叠分类不会把它藏掉 ✓ */
.bc-contact-sep{height:2px;background:var(--line);margin:8px 14px 10px}
/* 图标栏那颗聊天气泡（跟别的图标一样是 SVG，不用 emoji ✗）
   ⚠️ 联系人气泡下面那条分隔线**必须写宽度**：真因是图标栏为
      `flex-direction:column + align-items:center`（见 .channel-icons），
      不写宽度 ⇒ 在居中的列容器里宽度算成 0 ⇒ **根本看不见** ✗
      ⇒ 补上宽度（+ 2px 高，1px 淡线别指望看得清 ✓） */
.bc-contact-ico-sep{width:26px;height:2px;background:var(--line);margin:6px 0 7px;flex:0 0 auto}
/* ---- 联系人页 ----
   整页套**自己的**页容器（内边距跟 `.msg-block` 一样是 8/18/12 ✓），
   **但不能用 `.msg-block`** —— 那条规则里有 `.msg-block:hover{background:var(--hover)}`，
   套上去会变成"鼠标一移上去整页颜色变重" ✗
   ⇒ 保留对齐、去掉悬停变重 ✓ */
.bc-ct-page{padding:8px 18px 12px}
.bc-ct-head{padding:0 0 10px}
.bc-ct-title{font-size: calc(16px * var(--bc-fs-scale, 1));font-weight:700;color:var(--tx-1)}
.bc-ct-sub{font-size: calc(12px * var(--bc-fs-scale, 1));color:var(--tx-3);margin-top:3px}
/* 可点跳转的文字（不加按钮、不加边框底纹，只变色 —— 别破坏简洁 ✓）*/
.bc-jump{color:var(--gold);cursor:pointer;border-bottom:1px dashed rgba(229,164,31,.55)}
.bc-jump:hover{color:var(--tx-1);border-bottom-color:var(--tx-1)}
/* 「……还有 N 条」的收尾条（外观丑）
   ⚠️ 原来是一条裸文本：省略号开头 ＋ 一句灰话 ＋ 分号 ＋ 带虚线下划线的金色链接，
     和上面的记录行同字号同颜色 ⇒ 看着像列表里漏了一句没排版的说明 ✗
   ⇒ 改成一条规整的收尾条：淡底色 ＋ 圆角 ＋ 两头对齐，整条都能点 ✓
   整行是控件，所以悬停只换边框色，不加下划线 ✓ */
.bc-more-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:8px;padding:9px 12px;border-radius:10px;
  background:var(--surface-3);border:1px solid var(--line);
  font-size:calc(12.5px * var(--bc-fs-scale, 1));color:var(--tx-3);cursor:pointer;
  transition:border-color .15s ease}
.bc-more-row:hover{border-color:rgba(201,146,44,.55)}
.bc-more-row .mr-all{color:var(--gold);font-weight:700;white-space:nowrap}
.bc-ct-tabs{display:flex;gap:8px;margin:2px 0 12px}
.bc-ct-tab{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--surface-2);color:var(--tx-2);
  border-radius:8px;font-family:inherit;font-size: calc(12.5px * var(--bc-fs-scale, 1));cursor:pointer;font-weight:600}
.bc-ct-tab.active{background:var(--sel-bg);color:var(--sel-tx);border-color:var(--sel-bg);font-weight:700}
/* 搜索 + 添加入口（照聊天软件手机版那一排做的 ✓）
   ⚠️ 搜索联系人的框**太宽**（左边都贴边了）⇒ 要缩小一点 ✗
   ⇒ 宽的是「添加好友」那颗按钮、放大镜那块是小的
   ⇒ 搜索框定个上限（别横着拉满 ✗）；剩下的宽度让「添加致孕方」撑满 ✓（左右边距交给 .msg-block ✓） */
.bc-ct-tools{display:flex;gap:8px;align-items:center;margin:0 0 10px}
/* 「隐藏已失活」——只影响这里看到的记录，不改账本 ✓ */
.bc-ct-hidedead{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;color:var(--tx-3);
  font-size: calc(12.5px * var(--bc-fs-scale, 1));cursor:pointer;user-select:none}
/* 两个筛选并排（隐藏已失活 / 只看中招）*/
.bc-ct-filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.bc-ct-filters .bc-ct-hidedead{margin:0 0 10px}
.bc-ct-hidedead input{width:15px;height:15px;accent-color:var(--gold);cursor:pointer}
.bc-ct-hideinfo{margin:10px 0 12px;color:var(--tx-3);font-size: calc(12px * var(--bc-fs-scale, 1))}
.bc-ct-search{flex:0 1 300px;min-width:140px;max-width:340px;display:flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--tx-3)}
.bc-ct-search:focus-within{border-color:var(--gold)}
.bc-ct-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--tx-1);font-family:inherit;
  font-size: calc(13px * var(--bc-fs-scale, 1));outline:none}
.bc-ct-add{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--tx-1);
  font-family:inherit;font-weight:600;cursor:pointer;font-size: calc(12.5px * var(--bc-fs-scale, 1));white-space:nowrap}
.bc-ct-add:hover{border-color:var(--gold)}
.bc-ct-addrow{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.bc-ct-addrow input{flex:1;min-width:0;padding:8px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--tx-1);font-family:inherit;font-size: calc(13px * var(--bc-fs-scale, 1))}
.bc-ct-addok,.bc-ct-addno{padding:8px 14px;border-radius:8px;border:1px solid var(--line);cursor:pointer;
  font-family:inherit;font-weight:600;font-size: calc(12.5px * var(--bc-fs-scale, 1))}
.bc-ct-addok{background:var(--sel-bg);color:var(--sel-tx);border-color:var(--sel-bg)}
.bc-ct-addno{background:var(--surface-2);color:var(--tx-2)}
.bc-ct-list{display:flex;flex-direction:column;gap:6px}
.bc-ct-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.bc-ct-row:hover{border-color:var(--gold)}
.bc-ct-row-main{display:flex;align-items:baseline;gap:8px;min-width:0}
.bc-ct-row-name{font-size: calc(14px * var(--bc-fs-scale, 1));font-weight:650;color:var(--tx-1)}
.bc-ct-row-race{font-size: calc(11.5px * var(--bc-fs-scale, 1));color:var(--tx-2);padding:1px 8px;border-radius:999px;
  background:var(--surface-3);border:1px solid var(--line)}
.bc-ct-row-race.unknown{color:var(--tx-3);font-style:italic}
.bc-ct-row-times{font-size: calc(11.5px * var(--bc-fs-scale, 1));color:var(--tx-3);font-variant-numeric:tabular-nums}
/* 「还没有记录」（已建档、剧情里还没发生过的人）—— 跟种族那格的「种族未知」同一种斜体 ✓
   ⚠️ 不靠降透明度表示"没记录"（定过：不许靠淡来区分状态 ✗） */
.bc-ct-row-times.none{font-style:italic}
.bc-ct-back{display:inline-block;margin:0 0 10px;padding:5px 12px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--tx-2);cursor:pointer;font-size: calc(12px * var(--bc-fs-scale, 1))}
.bc-ct-back:hover{border-color:var(--gold);color:var(--tx-1)}
.bc-ct-detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size: calc(13px * var(--bc-fs-scale, 1));color:var(--tx-2);font-weight:650;margin-bottom:8px}
/* ★ 左边这串（名字 · 种族 · 次数）跟右边两颗按钮**同一条中线**对齐 ——
   原来是纯 inline 混排，按钮自带 padding 会往下沉，看着就是"名字和按钮没对齐" ✗ */
.bc-ct-detail-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
/* 「正序 / 倒序」两颗（能换着看）—— 跟别处的两档控件同一种摆法 ✓ */
.bc-ct-orders{display:inline-flex;gap:6px;margin-left:auto;vertical-align:middle}
.bc-ct-orderbtn{padding:2px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--tx-2);font:inherit;font-size:calc(12px * var(--bc-fs-scale, 1));cursor:pointer}
.bc-ct-orderbtn.active{background:var(--sel-bg);color:var(--sel-tx);border-color:var(--sel-bg)}
/* ★ 种族可以当场改：一个胶囊 + 一颗小：改✓
   点它只把名字报给外壳，弹窗与写库都由外壳做（面板不许自己写数据 ✓） */
.bc-ct-racebox{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
/* ⚠️ 「改」字要**自己居中**：只给 padding 的话，默认的 line-height 会把字顶偏
   （感觉没有居中）⇒ 用 inline-flex 居中 ＋ line-height:1 ✓ */
.bc-ct-racebtn{display:inline-flex;align-items:center;justify-content:center;line-height:1;
  padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--tx-2);font-family:inherit;font-size:calc(11px * var(--bc-fs-scale, 1));cursor:pointer}
.bc-ct-racebtn:hover{border-color:var(--gold);color:var(--tx-1)}
.bc-ct-thread{display:flex;flex-direction:column;gap:8px}
/* 「还有 N 条更早的 · 点这里继续」（继续加载）——
   外壳一次只推一页，剩下的在这儿说清楚并给颗按钮 ⇒ 不会静默少一截 ✓ */
.bc-ct-more{display:flex;justify-content:center;padding:4px 0 2px}
.bc-ct-morebtn{width:100%;padding:8px 12px;border-radius:8px;border:1px dashed var(--line);background:transparent;
  color:var(--tx-2);font-family:inherit;font-size:calc(12.5px * var(--bc-fs-scale, 1));font-weight:600;cursor:pointer;transition:.15s}
.bc-ct-morebtn:hover{border-color:var(--gold);color:var(--tx-1)}
@media (max-width:560px){.bc-ct-morebtn{min-height:44px}}
.bc-ct-rec{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.bc-ct-rec:hover{border-color:var(--gold)}
/* 一条记录的详细来历（弹窗里那张表）*/
.bc-insem-click{cursor:pointer}
.bc-insem-click:hover{background:var(--surface-2);border-radius:6px}
.bc-detail{display:flex;flex-direction:column;gap:2px}
.bc-detail-row{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.bc-detail-row:last-child{border-bottom:none}
.bc-detail-k{flex:0 0 110px;color:var(--tx-3);font-size: calc(12px * var(--bc-fs-scale, 1))}
.bc-detail-v{flex:1 1 auto;color:var(--tx-1);font-size: calc(13.5px * var(--bc-fs-scale, 1));line-height:1.6;word-break:break-word}
.bc-ct-rec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bc-ct-when{font-size: calc(11.5px * var(--bc-fs-scale, 1));color:var(--tx-3);font-variant-numeric:tabular-nums}
.bc-ct-tag{font-size: calc(10.5px * var(--bc-fs-scale, 1));font-weight:700;padding:1px 8px;border-radius:999px}
.bc-ct-tag.hit{background:var(--sel-bg);color:var(--sel-tx)}
.bc-ct-rec-body{font-size: calc(13.5px * var(--bc-fs-scale, 1));color:var(--tx-1);line-height:1.6;margin-top:3px}
.bc-ct-dim{color:var(--tx-3)}
.bc-ct-sperm{display:block;font-size: calc(11.5px * var(--bc-fs-scale, 1));color:var(--tx-3);margin-top:2px}
.bc-ct-rec-foot{font-size: calc(11px * var(--bc-fs-scale, 1));color:var(--tx-3);margin-top:3px}

/* 骰子页的载入占位 */
.dice-loading{padding:18px 4px;color:var(--tx-3);font-size: calc(12.5px * var(--bc-fs-scale, 1));line-height:1.9}
.dice-failed{color:var(--red)}

  /* -------------------------------------------------------------------------
     致孕方锁定：卡片式切换

     ⚠️ 这段必须放在**面板自己的 style 里** —— 面板跑在 iframe 里，
        style.css 是外层样式表，在这里不生效 ✗

     ⚠️ 致孕方锁定那个切换**太丑**，而且不看文字根本发现不了要点它才能切换 ✗
        ⇒ 做成卡片切换那种 ✓
     ------------------------------------------------------------------------- */
  .kid-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 6px 0 14px;
  }
  /* 科普小折页（给「异父超级受精」一句白话解释）—— 默认收起，不占地方 ✓ */
  .zone-explain { margin-top: 10px; font-size: calc(11.5px * var(--bc-fs-scale, 1)); color: var(--tx-3); line-height: 1.75; }
  .zone-explain > summary { cursor: pointer; color: var(--blurple); }
  .zone-explain > div { margin-top: 5px; }
  .kid-card {
    flex: 0 1 auto;
    min-width: 104px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
    cursor: pointer;
    user-select: none;
    transition: border-color .13s ease, background-color .13s ease, transform .13s ease;
  }
  .kid-card:hover {
    border-color: var(--blurple);
    background: var(--surface-3);   /* ⚠️ 不写 var(--surface-1, …)：它全仓没有 ⇒ 一直空转 ✗ */
    transform: translateY(-1px);
  }
  .kid-card.active {
    border-color: var(--blurple);
    background: rgba(90, 101, 240, .11);
  }
  .kid-card-top {
    font-size: calc(11px * var(--bc-fs-scale, 1));
    line-height: 1.35;
    color: var(--tx-3);
    letter-spacing: .02em;
  }
  .kid-card.active .kid-card-top { color: var(--blurple); }
  .kid-card-name {
    margin-top: 3px;
    font-size: calc(15px * var(--bc-fs-scale, 1));
    font-weight: 700;
    line-height: 1.3;
    color: var(--tx-1);
  }
  .kid-card-roll {
    margin-top: 2px;
    font-size: calc(11px * var(--bc-fs-scale, 1));
    line-height: 1.3;
    color: var(--tx-3);
  }
  /* 选中孩子的细节（在卡片下面那块） */
  .kid-panel { padding: 2px 0 0; }
  .kid-line {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 4px 0;
    font-size: calc(13px * var(--bc-fs-scale, 1));
    line-height: 1.5;
  }
  .kid-tag {
    flex-shrink: 0;
    font-size: calc(11.5px * var(--bc-fs-scale, 1));
    color: var(--tx-3);
  }
  .kid-main { color: var(--tx-1); }
  .kid-extra { color: var(--tx-3); font-size: calc(12px * var(--bc-fs-scale, 1)); }
  .kid-main.fail { color: #d1477f; font-weight: 600; }

  /* -----------------------------------------------------------------
     易读模式（外壳通过 html[data-vision] 推进来 ✓）

     面板跑在 iframe 里，**拿不到外层 style.css 的变量** ✗
     ⇒ --bc-fs-scale 必须在这里自己定义一份 ✓
     （面板 117 条 font-size 都写成了 calc(原值 * 这个系数) ✓）
     ----------------------------------------------------------------- */
  :root { --bc-fs-scale: 1; }
  /* 易读模式也要把最淡那档灰提上来（不然外壳放大了、面板这一份还是淡的 ✗）。
     ⚠️ 深色那份必须单独写一条：`html[data-vision="large"]`（0,1,1）会盖过
        `[data-theme="dark"]`（0,1,0）⇒ 不写的话深色下会被刷成浅色那份的深字，
        深底上反而是深字、更看不见 ✗ */
  html[data-vision="large"] { --bc-fs-scale: 1.3; --tx-3: #4a4d55; }
  html[data-theme="dark"][data-vision="large"] { --tx-3: #c4bdb3; }
  /* 易读模式下，说明类文字多给点行距，长段落更好读 */
  html[data-vision="large"] .bc-hint,
  html[data-vision="large"] .empty-state,
  html[data-vision="large"] .kid-line {
    line-height: 1.85;
  }
</style>
</head>

<!-- ⚠️ 2026-10-14：`.bc-shell` 上那个 `collapsed`（收起成小胶囊）整套删了 ——
     面板在插件里永远展开，收纳交给悬浮球；留着它会让面板挂载的第一帧闪出一枚小胶囊 ✗ -->
<div class="bc-shell" id="mainApp">
  <div class="bc-app" id="bcApp">
    <aside class="channel-sidebar">
      <div class="server-header" id="serverHeader">
        <span class="server-name">身体监测</span>
        <span class="arrow"><svg class="ico-sm"><use href="#i-chevron-down"/></svg></span>
      </div>
      <div class="channel-list">
        <!-- 联系人入口（**照聊天软件那个样子**，下面配上分隔线 ✓）
             ⚠️ 两条规矩都守着：**文字栏是纯文字**（跟兄弟行一样只有 `#` ✓），
                **图标只出现在图标栏**（早先就定过：文字栏这里不要有图片，只有侧边栏有图片 ✓）
             ⚠️ 常驻：一个对象还没跟谁做过也有这个入口，点进去是空的 ✓ -->
        <div class="channel-item bc-contact-entry" data-view="contacts" title="联系人：按人看记录（点名字看和这个人的全部记录）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>联系人</div>
        <div class="bc-contact-sep"></div>
        <div class="channel-category">
          <div class="category-label">状态</div>
          <div class="channel-item active" data-view="overview"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>概览</div>
          <div class="channel-item" data-view="body" title="身体状态：生理状态 / 身体状况 / 近期性行为，还有当前挂着的身体痕迹"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>身体状态</div>
          <div class="channel-item" data-view="stage" title="透视：一整页只画这一刻的插画"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>透视</div>
          <div class="channel-item" data-view="fetus"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>胎儿动态</div>
          <div class="channel-item" data-view="zones"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>敏感带</div>
        </div>
        <div class="channel-category">
          <div class="category-label">记录</div>
          <div class="channel-item" data-view="judgelog" title="推演记录：这一轮变了什么（状态变化对比 + 最近一次推演明细）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>推演记录</div>
          <div class="channel-item" data-view="notes"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>随手记</div>
        <div class="channel-item bc-calendar-entry" data-view="calendar" title="日历：这个世界的日子（点一天就能写备注、圈红圈）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>日历</div>
        <div class="channel-item" data-view="time" title="时光机：逐楼回放（看某一楼当时长什么样）+ 导出/导入档案"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>时光机</div>
<div class="channel-item" data-view="conception" title="受孕记录：账本（受精判定 · 逐胎致孕方锁定 · 每次事件的流水 · 历史归档）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>受孕记录</div>
<div class="channel-item" data-view="achievements" title="成就：这个聊天里解锁过的（名字 · 一句吐槽 · 剧情日期）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>成就</div>
<!-- 「孩子」频道 ——
     跟**胎儿动态**分开单开一档：胎儿是胎儿，出生了就不是胎儿了 ✓
     只显示**当前正在查看的那个人**生的（跟着当前查看的人变 ✓） -->
<div class="channel-item" data-view="children" title="孩子：出生后的记录（名字 · 性别 · 出生日期 · 年龄 · 另一个亲代）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>孩子</div>
        </div>
        <div class="channel-category">
          <div class="category-label">工具</div>
          <div class="channel-item" data-view="dice"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>骰子</div>
          <div class="channel-item" data-view="calc" title="占卜台：看这一轮的数字是怎么算出来的"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>占卜台</div>
          <div class="channel-item" data-view="localmusic"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>本地点播</div>
          <div class="channel-item" data-view="netease" title="小云台：贴网易云的歌单或歌曲链接就能听"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>小云台</div>
          <!-- 「计时」频道（番茄钟）——
               单独一个栏位可以计时器 / 倒计时之类，这个绑定的是现实时间（避免沉迷于酒馆）✓
                ⇒**可以全做，然后自定义时间之类的**（理由是：**玩和挂机是不一样的** ✓）
               ⚠️ 位置：就是「工具」这一组里骰子、占卜台那里 ⇒ 必须留在「工具」 ✓ -->
          <div class="channel-item" data-view="timer" title="番茄钟：专注与休息轮流来（到点弹提醒）"><span class="hash"><svg class="ico-sm"><use href="#i-hash"/></svg></span>番茄钟</div>
        </div>
      </div>
      <div class="channel-icons">
        <!-- 联系人的图标：跟旁边那排**同一套线条 SVG** ✓（EMOJI 和其他图标样式不一样 ✗
             ⇒ 联系人的图标要和别的风格统一 ✓
             ⚠️⚠️ **顺序必须和上面那个文字列表（.channel-list）一字不差** ——
                侧边栏排序和文字主面板那顺序**不一致**会出问题 ✗
                ⇒ 现在的秩序 = 联系人 ｜ 状态（概览 / 透视 / 胎儿动态 / 敏感带）
                  ｜ 记录（推演记录 / 随手记 / 时光机 / 受孕记录 / 成就 / 孩子）
                  ｜ 工具（骰子 / 占卜台 / 本地点播 / 小云台）✓
                分隔线也按那三组走；units 里有一条断言拿这个名字序列跟文字栏逐项比对，
                以后谁只改一边就会红 ✓
                ⚠️ 生理监测**并回概览**了 ⇒ 这里不再有它 ✓ -->
        <div class="channel-icon-btn" data-view="contacts" title="联系人"><svg><use href="#i-chat"/></svg></div>
        <div class="bc-contact-ico-sep"></div>
        <div class="channel-icon-btn active" data-view="overview" title="概览"><svg><use href="#i-home"/></svg></div>

        <div class="channel-icon-btn xray" data-view="stage" title="透视：一整页只画这一刻的插画"><svg><use href="#i-eye"/></svg></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var app = $('bcApp');
  var htmlEl = document.documentElement;
  var LS_THEME='bc_theme',
      LS_CHANNEL='bc_channel_collapsed', LS_AVATAR='bc_custom_avatar',
      // ★ 自动解析出来的人设头像（按作用域存；和玩家上传的 LS_AVATAR 分开 ✓）
      LS_AUTO='bc_auto_avatar',
      LS_STATUS='bc_user_status', LS_SIGN='bc_user_sign',
      LS_NOTES_GLOBAL='bc_notes_global',
      LS_NOTES_CHAT_PREFIX='bc_notes_chat_',
      LS_NET='bc_netease_url', LS_MASK='bc_mask',
      LS_VOL='bc_volume', LS_HINT_PREFIX='bc_week_hint_',
      LS_UPDATE_PREFIX='bc_last_update_', LS_ZONE_NOTE_PREFIX='bc_zone_note_',
      // ★ 2026-10-15：「上次渲染用的原文」也要**存进 localStorage**（只存内存的话，
      //   重新进聊天 = 面板文档重建 ⇒ 内存那份没了 ⇒ 每次都被当成"内容变了" ✗）
      LS_RAW_PREFIX='bc_last_raw_',
      LS_CHILD_COLLAPSE='bc_child_collapse', LS_DIV_HISTORY='bc_div_history';
  var NOTE_PREVIEW_LIMIT = 100;
  var ZONE_NOTES_LIMIT = 300;
  var DIV_HISTORY_LIMIT = 5;

  var currentView = 'overview';
  var currentProfile = null;
  var currentPeriods = [];
  var isMasked = false;

  var customAvatarUrl = null;
  var autoAvatarUrl = null;
  var userStatus = 'online';
  var userSign = '';
  var notesList = [];
  // 随手记分两份：聊天内默认看「本聊天」，可以切到「全局」；非聊天页面只有「全局」
  var notesScope = 'chat';
  var notesChatKeyLoaded = null;
  var notesLoadedKey = null;   // 现在内存里这份笔记是从哪个键读出来的
  var musicVolume = 0.7;

  var audioPlayer = new Audio();
  var musicList = [];
  var musicIndex = -1;
  var musicMode = 'loop-all';
  var musicFolderName = '';
  var musicFolderHandle = null;
  var lyricsList = [];

  var expandedZones = {};
  var collapsedChildren = {};
  var lastUpdateTs = 0;
  // ★★ 2026-10-15：「这个时间戳是**外壳给的**」标记 ——
  //   外壳给的就是**该对象上次推演的时间**（权威 ✓）；给了之后面板**不许自己再盖** ✗
  //   （原来靠自己比"渲染出来的文字" ⇒ 重渲染出一样的文字也算变 ⇒ 一重进就"刚刚更新" ✗✗）
  var shellGaveTs = false;
  var lastRenderedRaw = null;   // 上一次 render 用的原文（比它才知道"内容真的变了"✓）
  var lastUpdateTimer = null;

  var VIEW_NAMES = {overview:'概览', body:'身体状态', stage:'透视', fetus:'胎儿动态', zones:'敏感带', period:'生理监测', dice:'骰子', calc:'占卜台', localmusic:'本地点播', netease:'小云台', timer:'番茄钟', notes:'随手记', calendar:'日历', time:'时光机', contacts:'联系人', conception:'受孕记录', judgelog:'推演记录', achievements:'成就', children:'孩子'};
  var STATUS_TEXT = {online:'在线', idle:'闲置', dnd:'请勿打扰', invisible:'隐身'};

  function cleanStr(s){ return String(s||'').replace(/\uFFFD+/g,'').replace(/\u0000/g,''); }
  function safe(s){ return cleanStr(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  function nl2br(s){ return safe(s).replace(/\n/g,'<br>'); }
  /* 「推演报告 · 痕迹」那一行怎么显示 ——
     契约让它报 [{part,kind,level}] 这种对象数组（老写法是字符串）⇒ 两种都要认 ✓
     ⚠️ 直接 String(数组) 会印出 [object Object],[object Object]✗ */
  function traceReportText(v){
    function one(x){
      if(x == null) return '';
      if(typeof x !== 'object') return String(x).trim();
      return [x.part, x.kind, x.level]
        .filter(function(y){ return y != null && String(y).trim() !== ''; })
        .map(function(y){ return String(y).trim(); }).join('｜');
    }
    if(v == null) return '';
    if(Array.isArray(v)) return v.map(one).filter(function(s){ return s; }).join(' · ');
    return one(v);
  }
  function loadLS(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function saveLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec/60), s = Math.floor(sec%60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtAgo(ms){
    if(!ms || ms < 0) return '';
    var sec = Math.floor((Date.now() - ms) / 1000);
    if(sec < 5) return '刚刚更新';
    if(sec < 60) return sec + ' 秒前更新';
    var min = Math.floor(sec / 60);
    if(min < 60) return min + ' 分钟前更新';
    var hr = Math.floor(min / 60);
    if(hr < 24) return hr + ' 小时前更新';
    var d = Math.floor(hr / 24);
    return d + ' 天前更新';
  }
  function getCtx(){
    try{
      if(window.SillyTavern && typeof window.SillyTavern.getContext === 'function') return window.SillyTavern.getContext();
      if(typeof getContext === 'function') return getContext();
    }catch(e){}
    return null;
  }
  function getChatKey(){
    var ctx = getCtx();
    if(ctx){
      if(ctx.chatId !== undefined && ctx.chatId !== null) return 'chat_' + ctx.chatId;
      if(ctx.chat_metadata && ctx.chat_metadata.chat_id) return 'chat_' + ctx.chat_metadata.chat_id;
      if(ctx.chatMetadata && ctx.chatMetadata.chat_id) return 'chat_' + ctx.chatMetadata.chat_id;
      if(ctx.charId !== undefined && ctx.charId !== null) return 'char_' + ctx.charId;
      if(ctx.name2) return 'char_' + ctx.name2;
    }
    return 'global';
  }
  function getHintKey(){ return LS_HINT_PREFIX + getChatKey(); }
  function getUpdateKey(){ return LS_UPDATE_PREFIX + getChatKey(); }
  function getRawKey(){ return LS_RAW_PREFIX + getChatKey(); }
  function getZoneNoteKey(zoneName){ return LS_ZONE_NOTE_PREFIX + getChatKey() + '_' + encodeURIComponent(zoneName || ''); }

  /* ── 随手记：全局那份 / 本聊天那份 ───────────────────────────────
     为什么要分：所有聊天共用 localStorage 里唯一一个 bc_notes 的话，
     每个聊天都看到同一份笔记 ⇒ 沉浸感直接没了 ✗

     两份各自的键：
       全局   bc_notes_global
       本聊天 bc_notes_chat_<聊天 id>
     聊天内默认「本聊天」，顶上可以切到「全局」；
     非聊天页面（= 还没进入聊天内，也就是拿不到 chatId）只有全局那一份，连切换条都不显示。
      ⚠️ 非聊天页面**不是**"上帝视角"那种角色扮演风格，
         就是单纯没进聊天；别再把这两个概念混在一起 ✗ */

  // 面板自己的构建标记：用来确认到底加载了哪一版文件（拿到缓存的旧文件时一眼能看出来）
  var PANEL_BUILD = '2026-10-31-31';
  // 界面上不显示它，但留个查询口 —— 报 BUG 时能确认加载的是哪一版 ✓
  try{ window.__bodycordPanelBuild = PANEL_BUILD; }catch(e){}

  /* ── 「在不在聊天里」必须以**实时读数**为准，不能信外壳推来的一次性标志 ──────
     ⚠️ 外壳推来的一次性标志会骗人：面板比聊天先就绪（页面刚打开时），
     那一刻外壳推来的是「没进聊天」；
     而外壳的心跳**只同步界面、不会重推数据** ⇒ 这个标志就永远停在旧值 ✗。

     ⇒ 正解：面板直接读**父窗口的酒馆上下文**（srcdoc iframe 同源，能直接读），
       每次调用都是实时值 ✓；外壳推来的标志只当第二兜底。 */
  function notesParentCtx(){
    try{
      var p = window.parent;
      if(!p || p === window) return null;                    // 不在 iframe 里就算了
      if(p.SillyTavern && typeof p.SillyTavern.getContext === 'function') return p.SillyTavern.getContext() || null;
    }catch(e){ /* 跨域 / 拿不到就退回兜底 */ }
    return null;
  }
  // 这个上下文里的「聊天 id」（不同酒馆版本字段名不一样，三种都认）
  function notesCtxChatId(c){
    if(!c) return '';
    if(c.chatId !== undefined && c.chatId !== null && String(c.chatId) !== '') return String(c.chatId);
    if(c.chatMetadata && c.chatMetadata.chat_id) return String(c.chatMetadata.chat_id);
    if(c.chat_metadata && c.chat_metadata.chat_id) return String(c.chat_metadata.chat_id);
    return '';
  }
  function notesInChat(){
    var pc = notesParentCtx();
    if(pc) return !!notesCtxChatId(pc);                        // ★ 实时，最可信
    try{ if(typeof window.__bodycordInChatPage === 'function') return !!window.__bodycordInChatPage(); }catch(e){}
    return !document.documentElement.classList.contains('bc-notes-outside-chat');
  }
  // 插件算好的「剧情日期 / 虚拟日期」（存在 chat_metadata 的 bodycord_state.fictionDate 里）——
  // ★ 也从父窗口**实时**读：这样就算 AI 这一轮没写「当前时间」，笔记也记得下日期 ✓
  function notesStoryDate(){
    try{
      var pc = notesParentCtx();
      var meta = pc && (pc.chatMetadata || pc.chat_metadata);
      var st = meta && meta['bodycord_state'];
      var d = st && st.fictionDate;
      if(d && String(d).trim()) return String(d).trim();
    }catch(e){ /* 读不到就走后面的兜底 */ }
    return '';
  }
  function notesChatId(){
    var live = notesCtxChatId(notesParentCtx());
    if(live) return live;                                      // ★ 实时优先
    var fromShim = notesCtxChatId(getCtx());                   // 外壳推来的（可能是兜底值）
    if(fromShim) return fromShim;
    return getChatKey();
  }
  // 「现在是哪个聊天」的统一读数（非聊天就是 global）：换聊天 / 进出聊天都靠它发现
  function notesLiveChatKey(){
    return notesInChat() ? notesChatId() : 'global';
  }
  function notesKey(scope){
    return scope === 'global' ? LS_NOTES_GLOBAL : (LS_NOTES_CHAT_PREFIX + notesChatId());
  }
  // 非聊天页面一律落到全局那份（别去碰"某个聊天的"键）
  function notesScopeNow(){
    if(!notesInChat()) return 'global';
    return notesScope === 'global' ? 'global' : 'chat';
  }
  function notesScopeLabel(){
    return notesScopeNow() === 'global' ? '全局' : '本聊天';
  }
  // 构建号还在（见 PANEL_BUILD / window.__bodycordPanelBuild），要确认版本时问它 ✓
  function loadNotesAt(scope){
    try{
      var raw = loadLS(notesKey(scope));
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveNotesHere(){
    saveLS(notesKey(notesScopeNow()), JSON.stringify(notesList));
  }
  /* 清掉旧前缀（dc_）留下的键 —— dc 的那批都删掉（现在只有本插件在用，没人会丢失数据 ✓）
     ⚠️ **只删我们自己用过的那些键名 / 前缀**，绝不做 `dc_*` 通配清理 ——
        别的扩展也可能用 dc_ 开头存东西，一锅端会把别人的数据删掉 ✗ */
  var OLD_KEY_PREFIX = 'dc_';
  var OLD_KEYS_FIXED = [
    'dc_open', 'dc_theme', 'dc_channel_collapsed', 'dc_custom_avatar', 'dc_user_status', 'dc_user_sign',
    'dc_notes', 'dc_notes_global', 'dc_netease_url', 'dc_mask', 'dc_volume',
    'dc_child_collapse', 'dc_div_history', 'dc_music_meta', 'dc_group_collapsed',
  ];
  var OLD_KEYS_PREFIX = ['dc_week_hint_', 'dc_last_update_', 'dc_zone_note_', 'dc_notes_chat_'];
  function cleanupOldKeys(){
    try{
      var kill = OLD_KEYS_FIXED.slice();
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k || k.indexOf(OLD_KEY_PREFIX) !== 0) continue;
        for(var j = 0; j < OLD_KEYS_PREFIX.length; j++){
          if(k.indexOf(OLD_KEYS_PREFIX[j]) === 0){ kill.push(k); break; }

      //   ⚠️ 从前往后会抓到聊天刚开始时的旧人设 ✗

        if(!doc) continue;
        var nodes;
        try{ nodes = doc.querySelectorAll(sels[s]); }catch(e){ continue; }
        for(var k = 0; k < nodes.length; k++){
          var el = nodes[backward ? (nodes.length - 1 - k) : k];
          if(el.tagName === 'IMG'){
            var src = el.src || '';
            if(src && src.indexOf('data:image/gif;base64,R0lGODlhAQAB') !== 0 && src.length > 40) return src;

    //   原来先 remove 旧图、再插新图 ⇒ 新图（/thumbnail…）没进缓存时要等一个请求，

  /* ★★ 2026-10-18（支持多大的图 / 2+MB 横图不能用）：

     2MB 的图 ≈ 2.7M 字符 ⇒ 加上酒馆原有数据很容易顶到配额 ⇒ 存不下就被静默吞掉 ✗
     ⇒ 两档：
       ① 小图（≤ 1.2MB）原样存，动图保留动画 ✓
       ② 大图 / 原样存不下 ⇒ 压成最长边 512 的 WebP（头像显示只有 96px 上下，够清晰 ✓）

  var AVATAR_RAW_MAX = 1.2 * 1024 * 1024;
  var AVATAR_FILE_MAX = 30 * 1024 * 1024;
  function readFileDataUrl(file){
    return new Promise(function(resolve, reject){
      var r = new FileReader();
      r.onload = function(){ resolve(String(r.result || '')); };
      r.onerror = function(){ reject(new Error('读取失败')); };

  function compressAvatarFile(file, max, quality){
    return new Promise(function(resolve, reject){
      var objUrl = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth || img.width || 1;
          var h = img.naturalHeight || img.height || 1;
          var scale = Math.min(1, max / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var c = document.createElement('canvas');
          c.width = cw; c.height = ch;
          var ctx = c.getContext('2d');
          if(!ctx) throw new Error('拿不到画布');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, cw, ch);
          var out = '';
          try{ out = c.toDataURL('image/webp', quality); }catch(e){ out = ''; }
          if(!out || out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/png');
          resolve(out);
        }catch(e){ reject(e); }
        finally { try{ URL.revokeObjectURL(objUrl); }catch(e){} }
      };
      img.onerror = function(){ try{ URL.revokeObjectURL(objUrl); }catch(e){} reject(new Error('图片解不开')); };
      img.src = objUrl;
    });
  }
  async function storeAvatarFile(file){

    if(file.size <= AVATAR_RAW_MAX){
      var raw = await readFileDataUrl(file);
      saveLS(LS_AVATAR, raw);
      if(loadLS(LS_AVATAR) === raw) return { url: raw, compressed: false };
    }
    // ② 大图 / 原样存不下 ⇒ 压缩（静态；这也是 2+MB 横图之前用不了的原因）
    var small = await compressAvatarFile(file, 512, 0.9);

    if(loadLS(LS_AVATAR) === small) return { url: small, compressed: true };
    throw new Error('存不下');
  }

  function buildMentions(value){

    raw = raw.replace(/[（(]([^）)]*)[）)]/g, function(_, inner){
      if(inner.trim()) notes.push(inner.trim());
      return '';
    });
    var bm = raw.match(/\[([^\]]+)\]/);
    if(bm) raw = bm[1];
    var names = raw.split(/[、,，;；\/]/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(!names.length) return safe(value);
    // ★ 点击这个被艾特的角色可以直接跳转到联系人界面里面的这个人身上 ✓
    //   ⇒ 每颗胶囊带上名字（面板里点它就跳到「联系人」页的那个人身上 ✓）
    var html = names.map(function(n){ return '<span class="mention" data-bc-name="' + safe(n) + '">@' + safe(n) + '</span>'; }).join(' ');

  /* 列表里的一行：名字 + 种族（拿不到种族就写「种族未知」✓）

  /* 整页包一层**自己的**页容器（内边距跟 `.msg-block` 一样 ✓，但避开它的悬停变重 ✗）

            '<input type="checkbox" ' + (contactsOnlyPreg ? 'checked' : '') +

  /* 搜索过滤（纯函数，方便单测 ✓）：名字或种族命中就留下 */

    if(!q) return list || [];
    return (list || []).filter(function(g){
      return String(g.name || '').toLowerCase().indexOf(q) >= 0
        || String(g.race || '').toLowerCase().indexOf(q) >= 0;
    });

  /* 从「受孕记录」跳到「联系人 · 那个人」：

  /* ★ 一条记录的详细来历（受孕记录 / 联系人 两处共用）

  window.__openDetail = function(title, html){

  function recordDetailHtml(x){

    if(x.spermText) push('精子', safe(x.spermText));
    else if(x.viableUntil != null) push('存活到', '第 ' + safe(x.viableUntil) + ' 天');

    else if(x.spermAliveNow === false) push('现在', '已过存活期，不再算进累计');
    push('中招标记', x.conceived
      ? '<b>有</b>（这一批是判定时候选里的那一批）'
      : '没有');

  }
  /* 受孕事件里点一条 —— 人名放标题（下面没有「和谁」那一行了 ✓）*/

  /* ★★ 点 @名字 ⇒ 跳到「联系人」页的这个人身上
     （点击这个被艾特的角色，直接跳转到联系人界面里的这个人身上 ✓）
     ⚠️ 退路选的是 **A**：虽然不一定找不到，但得做退路 ✓ ⇒ 两个页签都找不到时，

  function jumpToContact(name){
    var want = String(name || '').trim();
    if(!want) return;

    if(!d) return;
    var keepTab = contactsTab;
    // 两个页签都翻一遍：谁那儿有这个名字，就切到谁那儿去 ✓

      for(var i = 0; i < list.length; i++){
        if(String(list[i].name || '').trim() === want){ foundTab = tabs[ti]; foundIdx = i; break; }
      }

    if(foundIdx !== null){
      contactsTab = foundTab;
      contactsQuery = '';          // 清掉搜索词：列表里那条才在，下标才对得上 ✓
      contactsPick = foundIdx;     // 直接把那个人的详情打开 ✓
      contactsAddOpen = false;
    }else{
      contactsTab = keepTab;
      contactsQuery = want;        // 退路：搜给他看（找不到就是「没有找到「X」」✓）
      contactsPick = null;
    }
