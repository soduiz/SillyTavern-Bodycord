  /* 「推演记录」频道
     A = 状态变化对比（上一轮→这一轮哪些字段变了）
               B = 最近一次推演的明细（时间、剧情时间、取用了哪些骰子）
     两块都是**纯插件算的**，一个字都不问 AI，所以不吃 token。
     注意：这里**没有编辑、没有同步** —— 编辑会破坏快照数据链（会不会破坏插件的数据？答案是会），同步会覆盖当前面板，两者都砍掉了。 */
  function renderJudgeLog(){
    var d = (typeof window.__bodycordGetJudgeLog === 'function' ? window.__bodycordGetJudgeLog() : null) || {};
    var diff = d.diff || { changes: [] };
    var last = d.last || null;
    var parts = [];

    // ── A 状态变化对比 ──
    if(diff.changes && diff.changes.length){
      var rows = diff.changes.map(function(c){
        return '<div class="mention-line"><span class="ml-label">' + safe(c.label) + '</span>' +
               '<span class="ml-from">' + safe(c.from) + '</span>' +
               '<span class="ml-arrow">→</span>' +
               '<span class="ml-to">' + safe(c.to) + '</span></div>';
      }).join('');
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar pin">' + ICO.chart + '</div>' +
            '<span class="block-author">状态变化</span>' +
            '<span class="block-tag">' + (diff.from != null ? '第' + diff.from + '层' : '上轮') +
              ' → ' + (diff.to != null ? '第' + diff.to + '层' : '本轮') + '</span>' +
          '</div>' + rows +
        '</div>'
      );
    }

    // ── B 最近一次推演 ──
    if(last){
      var used = (last.used || []).filter(function(x){ return x.value != null; });
      // ★ 这一行是「这次掷了什么」，value 是个裸数字 ⇒ 不写清是什么会被读成别的东西
      //   （精子存活 3 被读成只有 3 批，同屏受孕记录写着 5 批 ✗）
      //   ⇒ 天数类的那几种把名字写全 ＋ 值后面带「天」✓
      var USED_LABEL = { '精子存活': '本次精子存活天数' };
      var USED_UNIT = { '精子存活': ' 天' };
      // 「着床天数」记的是掷出来的 1~5，真天数要查表（3 ⇒ 8 天）⇒ 只印 3 会被当成"3 天" ✗
      var USED_IMPLANT = { 1: 6, 2: 7, 3: 8, 4: 9, 5: 10 };
      var usedHtml = used.length
        ? used.map(function(x){
            var nm = USED_LABEL[x.for] || x.for || '取用';
            var vl = String(x.value) + (USED_UNIT[x.for] || '');
            if(x.for === '着床天数'){
              var dn = USED_IMPLANT[Number(x.value)];
              if(dn) vl = dn + ' 天（掷出 ' + Number(x.value) + '）';
            }
            return '<div class="mention-line"><span class="ml-label">' + safe(nm) + '</span><span class="ml-to">' + safe(vl) + '</span></div>';
          }).join('')
        : '<div class="bc-hint">这次没有取用骰子（纯累加，不需要掷）</div>';
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar bot">' + ICO.sparkle + '</div>' +
            '<span class="block-author">最近一次推演</span>' +
            (last.messageIndex != null ? '<span class="block-tag">第' + last.messageIndex + '层</span>' : '') +
          '</div>' +
          '<div class="embed-panel blue">' +
            '<div class="fields-grid">' +
              (last.name ? '<div><div class="field-label">对象</div><div class="field-value">' + safe(last.name) + '</div></div>' : '') +
              (last.sub ? '<div><div class="field-label">剧情时间</div><div class="field-value">' + safe(last.sub) + '</div></div>' : '') +
            '</div>' +
            // 「AI 报了什么」—— 判官这次的 note / judgment / traces
            (function(){
              var rp = last.report;
              if(!rp) return '';
              var lines = [];
              if(rp.note) lines.push('<div class="mention-line"><span class="ml-label">AI 总结</span><span class="ml-to">' + safe(rp.note) + '</span></div>');
              /* ★ 判定时机在插件里 ⇒ judgment 里没有 due / rate
                 ⇒ 这一行印它报的候选致孕方名单（一层名单，可能两层 ⇒ 只取第一层 ✓）*/
              if(rp.judgment && Array.isArray(rp.judgment.impregnatorCandidates) && rp.judgment.impregnatorCandidates.length) lines.push('<div class="mention-line"><span class="ml-label">报告候选</span><span class="ml-to">' + safe(rp.judgment.impregnatorCandidates.map(function(x){ return Array.isArray(x) ? String(x[0]) : String(x); }).join('、')) + '</span></div>');
              if(rp.traces && rp.traces.new) lines.push('<div class="mention-line"><span class="ml-label">报告痕迹</span><span class="ml-to">' + safe(traceReportText(rp.traces.new)) + '</span></div>');
              return lines.join('');
            })() +
            // ★ 先摆系统最终判定，再摆模型 cot ——
            //   模型是在插件判定**之前**写的，可能还写着上一轮的旧结果；
            //   不把最终判定单独摆出来，两处会看着互相打架 ✓
            (last.final ? '<div style="margin-top:8px"><div class="field-label">系统最终判定</div><div class="field-value" style="font-weight:600">' + safe(last.final) + '</div></div>' : '') +
            // ★ 它每轮的**推演过程**（cot）：存下来给这一页看 ——
            //   排查全靠它。pre-wrap 保留它自己的分点换行（挤成一行看不清 ✗）
            (last.report && last.report.cot ? '<div style="margin-top:8px"><div class="field-label">推演过程（模型在判定前写的，可能写的是上一轮结果）</div><div class="field-value" style="font-weight:500;line-height:1.7;white-space:pre-wrap">' + safe(last.report.cot) + '</div></div>' : '') +
            usedHtml +
          '</div>' +
        '</div>'
      );
    }

    if(!parts.length){
      parts.push('<div class="empty-state">还没有推演记录。<br>推演一次之后，这里会显示"这一轮变了什么"</div>');
    }
    return parts.join('');
  }

  /* 外壳推来新的推演记录时，如果正停在这一页就重画 ✓
     ⚠️ 必须补这一个：外壳推数据的顺序是 `__bodycordUpdate`（它立刻 renderMain，
        那时用的还是**旧**的 JUDGELOG）→ 再 `__bodycordSetJudgeLog`。
        没有这个钩子的话，推演记录页永远显示上一轮的内容，切走再切回才对 ✗ */
  window.__bodycordJudgeLogChanged = function(){
    try{
      if(currentView === 'judgelog'){
        var jp = getPanel('judgelog');
        if(jp) jp.innerHTML = renderJudgeLog();
      }
    }catch(e){}
  };

  /* 百分比数字：整数就不带小数点，52.5 这种保留一位 */
  function fmtNum(v){
    var n = Number(v);
    if(!isFinite(n)) return String(v == null ? '' : v);
    return (Math.round(n * 10) / 10) % 1 === 0 ? String(Math.round(n)) : n.toFixed(1);
  }

  function renderConception(p){
    var data = (typeof window.__bodycordGetConception === 'function' ? window.__bodycordGetConception() : null) || {};
    var parts = [];

    // ── 提醒（着床完成 / 每胎预产期）──
    // ★ 提醒要记录也得放在频道里面 ⇒「受孕记录」里面 ✓
    //   （这份数据由外壳按**当前正在看的那个对象**过滤好推过来，形状见 store.js 的 conceptionForPanel ✓）
    var al = Array.isArray(data.alerts) ? data.alerts : [];
    if(al.length){
      var alRows = al.map(function(a){
        var kind = a.kind === 'conceive' ? '已着床完成' : ('预产期' + (a.sub ? ('（' + a.sub + '）') : ''));
        return '<div class="bc-hint" style="margin:3px 0 0">' + kind + '：' + (a.date || '—')

      }).join('');
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar bot">' + ICO.pin + '</div>' +
            '<span class="block-author">提醒</span>' +
            '<span class="block-tag">BOT</span>' +
          '</div>' +
          alRows +
        '</div>'
      );
    }

    // ── 致孕方 ──
    if(p && p.isPregnant && p.d4 && p.d4[1] && p.d4[1] !== '无' && p.d4[1] !== '-'){
      var mentions = buildMentions(p.d4[1]);
      if(mentions){
        parts.push(
          '<div class="msg-block">' +
            '<div class="block-head">' +
              '<div class="block-avatar bot">' + ICO.chart + '</div>' +
              // ★ 名字是「谁干的好事」✓（"致孕方归属"太正经 ✗）
              //   ⚠️ 里面那行的标签**不能**再写「致孕方」⇒ 跟作者名重复，
              //      按"前面的字没必要留"那条**去掉**（意思全由作者名扛 ✓）
              '<span class="block-author">谁干的好事</span>' +
              '<span class="block-tag">BOT</span>' +
            '</div>' +
            '<div class="mention-line">' + mentions + '</div>' +
          '</div>'
        );
      }
    }

    // ── 受精判定（插件掷的）──
    var j = data.judgment;
    if(j && j.roll != null){
      var okCls = j.passed ? 'ok' : 'no';
      var verdict = j.passed ? '受精成功' : '未受精';
      // 比较符号要跟着结果走：成功是「掷出 ≤ 判定值」，失败是「掷出 > 判定值」
      // （原来两档都写 ≤，未受精时会出现「71 ≤ 16%」这种反着的句子 ✗）
      var cmp = j.passed ? '≤' : '>';
      // 判定值旁边那句括号由外壳算好给（valueNote）：两档的意思不一样 ——
      // 累计档超过 100% 叫「已封顶」，仅存活精子档比累计小是「裁掉了失活批次」，不是封顶 ✗
      var judgeText = fmtNum(j.judgeValue) + '%' + (j.valueNote || '');
      // ★ 着床判定（2026-10-14）：受精成功之后还有一道"这颗受精卵会不会着床"
      //   受精成功但没着床 ⇒ 这个周期不会怀孕
      var impFailed = (j.passed && j.implantPassed === false);
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar pin">' + ICO.sparkle + '</div>' +
            '<span class="block-author">受精判定</span>' +
            '<span class="block-tag">' + verdict + '</span>' +
            (j.sub ? '<span class="block-time">' + safe(j.sub) + '</span>' : '') +
          '</div>' +
          '<div class="embed-panel blue">' +
            '<div class="fields-grid">' +
              '<div><div class="field-label">判定值</div><div class="field-value">' + judgeText + '</div></div>' +
              '<div><div class="field-label">掷出</div><div class="field-value ' + okCls + '">' + j.roll + '</div></div>' +
              (j.passed && !impFailed && !j.implantKnown && j.implantLeft != null ? '<div><div class="field-label">着床还需</div><div class="field-value">' + j.implantLeft + ' 天</div></div>' : '') +
              (j.implantPassed != null ? '<div><div class="field-label">着床判定</div><div class="field-value ' + (impFailed ? 'no' : 'ok') + '">' + (j.implantRoll != null ? ('掷出 ' + j.implantRoll + ' → ' + (impFailed ? '没着床' : '着床')) : (impFailed ? '没着床' : '着床')) + '</div></div>' : '') +
            '</div>' +
            '<div class="panel-footer">掷出 ' + j.roll + ' ' + cmp + ' 判定值 ' + fmtNum(j.judgeValue) + '% → ' + verdict +
              (impFailed ? ' · 受精成功但没能着床，这个周期不会怀孕' : '') + '</div>' +
          '</div>' +
        '</div>'
      );
      // 判定值取哪个数：口径（累计 / 仅存活精子）由外壳写好一句话，面板只负责显示 ✓
      var basisNote = j.basisNote || j.lifeNote || '';
      if(basisNote){
        parts.push('<div class="bc-hint" style="margin:2px 18px 10px">' + safe(basisNote) + '</div>');
      }
    }

    // R 的解释：只在有判定记录时出现一次，免得没数据时也占一行
    if (j && j.roll != null) {
      parts.push('<div class="bc-hint" style="margin:2px 18px 10px">下面「受孕事件」里那个 R3 = 用了骰池里第 3 个随机数，方便回头对账。</div>');
    }

    // 当前选中的那一组致孕方 —— 下面的「受孕事件」要跟着它过滤
    var kidFilterBy = '';

    // ── 逐胎锁定致孕方（异卵异父）──
    // 一个按钮切换孩子来查看各自的数据；同一个父亲的双胞胎不用分开
    // ⇒ 做成**切换**：一组按钮，点哪个只显示哪一组的内容；同父的合并成一个标签。
    if(data.locks && data.locks.length > 1){
      // 先把同一个致孕方的孩子并到一起（同父双胞胎合成一个标签）
      var groups = [];
      for(var gi = 0; gi < data.locks.length; gi++){
        var gl = data.locks[gi];
        var hit = null;
        for(var gj = 0; gj < groups.length; gj++){
          if(groups[gj].impregnator === gl.impregnator){ hit = groups[gj]; break; }
        }
        if(hit){ hit.children.push(gl.child); if(gl.roll != null) hit.rolls.push(gl.roll); }
        else groups.push({ impregnator: gl.impregnator, children: [gl.child], rolls: gl.roll != null ? [gl.roll] : [] });
      }

      // ⚠️ 要的是**切换**，不是展开折叠（用 <details> 是错的 ✗）：
      //   ⇒ 一组按钮当切换条，点哪个就切过去，下面只显示那一组的内容。
      if(typeof kidSwitchIndex !== 'number' || kidSwitchIndex >= groups.length) kidSwitchIndex = 0;

      // 逐胎的胎儿数据：取自**面板自己的 currentProfile.d6[1]**（和 renderFetus 同一个解析器）。
      // 注意 conception 的 payload 里**没有** kids，别去 data.kids 找 ✗
      var _kids = (function(){
        try{
          if(typeof currentProfile === 'undefined' || !currentProfile || !currentProfile.d6) return [];
          var fi2 = parseFetusInfo(currentProfile.d6[1]);
          return (fi2 && fi2.children) ? fi2.children : [];
        }catch(e){ return []; }
      })();

      // 卡片式切换：纯文字标签会"看不出需要点文字才能切换" ✗
      // ⇒ 做成有边框、能看出是可点的卡片 ✓
      // ★ 卡片上**只写名字**，不写子位（胎数还没出来的时候「子1·子2」是占位符，
      //   摆上去会被读成已经有两个孩子）；要知道哪个孩子是谁，看下面每个孩子的「子N」行 ✓
      var tabs = groups.map(function(g, idx){
        return '<div class="kid-card' + (idx === kidSwitchIndex ? ' active' : '') + '" data-kid="' + idx + '">' +
                 '<div class="kid-card-name">' + safe(g.impregnator) + '</div>' +
                 (g.rolls.length ? '<div class="kid-card-roll">掷 ' + g.rolls.join('、') + '</div>' : '') +
               '</div>';
      }).join('');

      var sel = groups[kidSwitchIndex];
      kidFilterBy = sel.impregnator;   // 下面的「受孕事件」按它过滤 ✓
      var selKids = sel.children.map(function(c){
        var k = _kids[c - 1] || null;
        if(!k) return '<div class="kid-line"><span class="kid-tag">子' + c + '</span><span class="kid-main">（还没有单独的胎儿数据）</span></div>';
        var bits = [k.race, k.sex].filter(Boolean).join(' ');
        return '<div class="kid-line"><span class="kid-tag">子' + c + '</span>' +
               '<span class="kid-main">' + safe(bits || '（未填）') + '</span>' +
               (k.extra ? '<span class="kid-extra">' + safe(k.extra) + '</span>' : '') + '</div>';
      }).join('');

      var rows = '<div class="kid-switch">' + tabs + '</div>' +
        '<div class="kid-panel">' +
          '<div class="kid-head"><span class="kid-name">' + safe(sel.impregnator) + '</span>' +
            (sel.rolls.length ? '<span class="kid-roll">掷 ' + sel.rolls.join('、') + '</span>' : '') +
          '</div>' +
          selKids +
          '<div class="bc-hint">掷值就是锁定时从骰池里取的那个随机数，留着可以对账。</div>' +
        '</div>';

      // 点切换条里的按钮 → 记下选了哪个 → 重画这一屏
      setTimeout(function(){
        // ⚠️ 用 getPanel('conception')，不要瞎编 id（这个面板没有 conceptionView 这个 id）
        var box = getPanel('conception');
        if(!box) return;
        var btns = box.querySelectorAll('.kid-card');
        for(var bi = 0; bi < btns.length; bi++){
          btns[bi].addEventListener('click', function(){
            var ni = parseInt(this.getAttribute('data-kid'), 10);
            if(isNaN(ni)) return;
            kidSwitchIndex = ni;
            if(currentView === 'conception'){
              var cp2 = getPanel('conception');
              if(cp2) cp2.innerHTML = renderConception(currentProfile);
            }
          });
        }
      }, 0);
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar bot">' + ICO.chart + '</div>' +
            '<span class="block-author">致孕方锁定</span>' +
            '<span class="block-tag">逐胎</span>' +
          '</div>' +
          '<div class="embed-panel blue"><div class="fields-grid">' + rows + '</div></div>' +
          // ★ 在异父超级受精那里顺手科普一下是什么意思 ✓
          //   只在"真的出现多个致孕方"时显示（这时才有这个东西要解释 ✓）
          '<details class="zone-explain"><summary>两个致孕方？这是什么（点开看）</summary>' +
            '<div>这叫异父同期复孕。同一个妈妈、同一胎，孩子却有不同的致孕方。</div>' +
            '<div>发生条件是：一 · 这个周期排出了不止一个卵子（这就是异卵双胞胎的来源）；二 · 这些卵子在受精窗口内，被不同人的精子分别受精。</div>' +
            '<div>所以同一胎的孩子，长相、种族甚至肤色都可能完全不一样。</div>' +
            // ★ 补一句同卵（2026-10-14）：玩家那句：同卵多胎不可能致孕方不一样是科学
            //   ⇒ 面板得说清楚：同卵那一路不会出现上面这种情况 ✓
            '<div>另一种情况是同卵：一枚受精卵分裂成两个，这种孩子的性别和致孕方必然一模一样，上面那种事不会发生。概述里会写「（同卵）」，看到它就是这个意思。</div>' +
          '</details>' +
        '</div>'
      );
    }

    // ── 每一次内射 / 植入 ──
    var allInsems = data.insems || [];
    var list = allInsems;
    // 切换孩子时这里要跟着变（不然受孕事件的数据不动 ✗）
    //   ⇒ 按选中的致孕方过滤 ✓
    if(kidFilterBy){
      list = allInsems.filter(function(it){ return String(it.by) === String(kidFilterBy); });
    }
    // ★ 只看中招（只筛显示，不改账本 ✓）
    var hitHidden = 0;
    if(insemOnlyHit){
      var beforeHit = list.length;
      list = list.filter(function(it){ return !!it.conceived; });
      hitHidden = beforeHit - list.length;
    }
    // 截断前的完整名单（弹窗「看全部」用 ✓）
    var listAll = list.slice();
    // ★ 点开某一条要看它的原对象 ⇒ 按显示顺序存一份（onclick 只传下标 ✓）
    //   下标打在对象上（`__i`）而不是下标数组，弹窗「看全部」那份也能对上 ✓
    window.__insemRows = listAll.slice().reverse();
    window.__insemRows.forEach(function(it, i){ it.__i = i; });
    window.__insemAllHtml = '';   // 每次渲染先清掉上一份，免得弹窗打开是旧内容
    // ★ 显示截断（数据仍然留 200 条，只是别一股脑糊一屏）：
    //   永远保留「中招」那几条，其余只显示最近的 8 条，剩下的折叠成一行说明
    var RECENT = 8;
    // ⚠️ 表头那个「共 N 次」要用**截断前的总数**（这个计数是正常走的对吧）——
    //   原来直接用 list.length，而 list 已经在下面被截成 8 条 ⇒ 明明有 12 次却写「共 8 次」✗
    var totalTimes = list.length;
    var concealed = 0;
    if(list.length > RECENT + 1){
      var newest = list.slice(-RECENT);                    // 最近 8 条
      var older = list.slice(0, list.length - RECENT);     // 更早的
      var keepOlder = older.filter(function(it){ return it.conceived; });   // 更早里的中招，保留
      concealed = older.length - keepOlder.length;
      list = keepOlder.concat(newest);
    }
    if(list.length){
      var insemLine = function(it){
        var mark = it.conceived ? '<span class="block-tag" title="这一批计入了判定，并且这次判定中了">中招</span>' : '';
        // 精子存活：这一批还在不在存活期内 —— 面板要说明"为什么它不再算了"
        var lifeTag = '';
        // ★ **优先用外壳算好的结论** ——
        //   面板自己拿周期日号比，跨周期切换后会算错（明明过期了还显示"存活中" ✗）；
        //   老数据（没有绝对天数）时外壳给 null ⇒ 退回下面那一套比较 ✓
        if(it.spermAliveNow === true || it.spermAliveNow === false){
          lifeTag = it.spermAliveNow
            ? '<span class="block-tag" title="这批精子还在存活期内，会算进这个周期的受精累计">存活中</span>'
            : '<span class="block-tag" title="这批精子过了存活期，不再算进受精累计">已失活</span>';
        } else if(it.viableUntil != null && data.nowDay != null){
          // 跟存活期同一个时间轴：剧情天数（拿不到时后端会给轮次兜底）✓
          lifeTag = (Number(it.viableUntil) >= Number(data.nowDay))
            ? '<span class="block-tag" title="这批精子还在存活期内，会算进这个周期的受精累计">存活中</span>'
            : '<span class="block-tag" title="这批精子过了存活期，不再算进受精累计">已失活</span>';
        }
        // ★ 整条可点 = 看这一笔的详细来历（window.__insemRows 的下标 ✓）
        return '<div class="mention-line bc-insem-click" title="点开看这一笔的详细来历" onclick="window.__openInsemDetail(' + Number(it.__i) + ')">' +
          '<span class="ml-label">第' + it.round + '轮</span>' +
          // ★ 落账那一刻的剧情钟点（「不记钟点」的存档没有这格 ⇒ 不显示 ✓）
          (it.clk ? '<span title="这一次发生的剧情钟点">' + safe(it.clk) + '</span>' : '') +
          // ★ 互相跳转可以搞，但不能破坏界面的美观简洁性 ✓
          //   ⇒ **不加按钮**：把「谁」这三个字本身做成可点的（
          //     点它 = 去「联系人」看和这个人的全部记录）—— 版面一个字都没多 ✓
          '<span>' + safe(it.sub || '') + (it.sub ? ' · ' : '') +
            '<span class="bc-jump" title="去「联系人」看和这个人的全部记录" ' +
              'onclick="event.stopPropagation();window.__jumpToContact(\'' + safe(String(it.by || '').replace(/'/g, '')) + '\')">' +
              safe(it.by) + '</span>' +
            (it.note ? ' · ' + safe(it.note) : '') + (it.roll ? ' · ' + safe(it.roll) : '') + '</span>' + mark + lifeTag +
        '</div>';
      };
      var items = list.slice().reverse().map(insemLine).join('');
      // ★ 弹窗内容：截断前的全部（按新到旧），只在真有没列出来的记录时才算
      window.__insemAllHtml = (listAll.length > list.length)
        ? ('<div class="bc-hint" style="margin:0 0 8px">共 ' + listAll.length + ' 次 · 按新到旧</div>'
            + listAll.slice().reverse().map(insemLine).join(''))
        : '';
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar notes">' + ICO.note + '</div>' +
            '<span class="block-author">受孕事件</span>' +
            '<span class="block-tag">' + (kidFilterBy ? ('只看 ' + safe(kidFilterBy) + ' · ') : (insemOnlyHit ? '只看中招 · ' : '共 ')) + totalTimes + ' 次</span>' +
            '<span class="bc-jump" style="margin-left:auto" title="只筛显示，不改账本" ' +
              'onclick="window.__toggleInsemHit()">' + (insemOnlyHit ? '显示全部' : '只看中招') + '</span>' +
          '</div>' +
          items +
          (insemOnlyHit && hitHidden > 0
            ? '<div class="bc-hint" style="margin:12px 0 4px">只看中招：另有 ' + hitHidden + ' 次没有中招的没显示</div>'
            : '') +
          (concealed > 0 ? '<div class="bc-more-row" onclick="window.__openInsemAll()" title="看当前周期全部记录">'
            + '<span>还有 ' + concealed + ' 条更早的</span>'
            + '<span class="mr-all">查看全部 ' + totalTimes + ' 条</span></div>' : '') +
          // ★ 账本保险丝裁掉过的那些（上限 1000 + 到上限时明说 ✓）
          (Number(data.insemCut || 0) > 0
            ? '<div class="bc-hint" style="margin:6px 0 0">更早的 ' + Number(data.insemCut) +
              ' 条受孕记录已经清掉了。这个账本最多留 ' + Number(data.insemCap || 0) + ' 条，免得聊天文件无限变大</div>'
            : '') +
        '</div>'
      );
    } else if(insemOnlyHit && allInsems.length){
      // 开了「只看中招」但这周期一次都没中 —— 别让人以为记录丢了 ✓
      parts.push('<div class="msg-block"><div class="block-head">' +
        '<div class="block-avatar notes">' + ICO.note + '</div>' +
        '<span class="block-author">受孕事件</span>' +
        '<span class="block-tag">只看中招 · 0 次</span>' +
        '<span class="bc-jump" style="margin-left:auto" onclick="window.__toggleInsemHit()">显示全部</span>' +
        '</div><div class="empty-state">这个周期还没有中招的记录。<br>点右上角「显示全部」可以看全部 ' + allInsems.length + ' 次</div></div>');
    } else if(kidFilterBy && allInsems.length){
      // 有这个人的记录之外的情况 —— 说明清楚，别让人以为过滤坏了
      parts.push('<div class="bc-hint" style="margin:8px 0 0">' + safe(kidFilterBy) + ' 名下还没有受孕事件。点上面别的卡片可以看其他人</div>');
    } else if(!parts.length){
      parts.push('<div class="empty-state">还没有受孕相关的记录。<br>发生内射 / 卵植入并推演一次之后，这里会开始记</div>');
    }

    // ── 事后避孕药（受孕记录里也要看得到）──
    //   ⚠️ 只体现在累计受孕率的数字上的话，看不出"那天吃过药" ✗
    //   单独一块，不混进上面那条内射流水（那张列表按致孕方过滤，药没有致孕方 ✓）
    var pillList = data.pills || [];
    if(pillList.length){
      var pItems = pillList.slice().reverse().map(function(p){
        var when = (p.day == null) ? '' : ('周期 Day' + Number(p.day) + ' · ');
        var fold = (p.factor == null) ? '' : ('累计受孕率 ×' + Number(p.factor));
        return '<div class="mention-line">' +
          '<span class="ml-label">' + (p.round ? ('第' + Number(p.round) + '轮') : '—') + '</span>' +
          '<span>' + when + '事后避孕药' + (fold ? ' · ' + fold : '') + '</span>' +
        '</div>';
      }).join('');
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar notes">' + ICO.note + '</div>' +
            '<span class="block-author">事后避孕药</span>' +
            '<span class="block-tag">共 ' + pillList.length + ' 次</span>' +
          '</div>' +
          pItems +
        '</div>'
      );
    }

    // ── 历史归档（换周期 / 分娩时收起来的那几段）──
    // 加一个历史记录在里面归档，随时可以查看
    // 这里用 <details> 是对的：它本来就是"想看了再展开"，不是切换 ✓
    var arch = data.archive || [];
    if(arch.length){
      var archRows = arch.slice().reverse().map(function(a){
        var when = '';
        try{
          var d = new Date(Number(a.at) || 0);
          when = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
        }catch(e){ when = ''; }
        var who = (a.locks || []).map(function(l){ return '子' + l.child + '→' + safe(l.impregnator); }).join('，');
        var got = (a.conceived || []).length ? '中招：' + a.conceived.map(safe).join('、') : '本段未受孕';
        // 着床失败 / 受精失败要显眼一点，别让人以为"怀上了但没说是谁的"✓
        // 建议是在那里写上着床失败，不然会容易误会
        var _rs = String(a.reason || '周期结束');
        var _rsCls = (_rs.indexOf('着床失败') >= 0) ? ' fail' : ((_rs.indexOf('受精失败') >= 0) ? ' fail' : '');
        // 分娩 / 妊娠终止那一刻的胎儿原文（插件清那一格之前收进来的 ✓）
        // 单独一行：它本来就是「这一胎当时写的是什么」，跟上面那行账目不是一回事
        var _fetus = String(a.fetus || '').trim();
        var fetusRow = _fetus
          ? '<div class="kid-line"><span class="kid-tag">胎儿</span><span class="kid-main">' + safe(_fetus) + '</span></div>'
          : '';
        return '<div class="kid-line"><span class="kid-tag">' + safe(when) + '</span>' +
               '<span class="kid-main' + _rsCls + '">' + safe(_rs) + ' · ' + safe(String(a.count || 0)) + ' 条记录</span>' +
               '<span class="kid-extra">' + (who ? safe(who) + ' ｜ ' : '') + safe(got) + '</span></div>' + fetusRow;
      }).join('');
      parts.push(
        '<div class="msg-block">' +
          '<div class="block-head">' +
            '<div class="block-avatar notes">' + ICO.note + '</div>' +
            '<span class="block-author">历史归档</span>' +
            '<span class="block-tag">共 ' + arch.length + ' 段</span>' +
          '</div>' +
          '<details class="kid-fold">' +
            '<summary>展开看过去的周期</summary>' +
            archRows +
            '<div class="bc-hint">换周期或分娩时，当时的致孕方锁定与事件会被收进这里。累计受孕率不在这里，它永远只增不减。</div>' +
          '</details>' +
        '</div>'
      );
    }

    return parts.join('');
  }

  /* ═══════════════════════════════════════════════════════════════
     阶段插图 —— 由「透视」这个 BOT 发
     · 一个 BOT（名字叫「透视」）来发阶段插图；
       如果阶段插图是关闭的，BOT 就隐藏掉 ✓
     · ⇒ 整块就是一个**普通消息块**（头像 + 作者 + 标签 + 时间），跟面板里
       别的块同一种形态；一块光秃秃的图反而突兀 ✗
     · 关掉开关 / 外壳还没推数据 ⇒ **连这个 BOT 一起不出现** ✓
     · 数据由外壳推过来（`__bodycordGetStages` / `__bodycordSetStages`）——
       面板看不见精子存活 / 受精判定 / 着床，推导必须在外壳做 ✓
     ═══════════════════════════════════════════════════════════════ */

  /** 发阶段插图的这个 BOT 叫什么（要改名只改这一处 ✓） */
  var STAGE_BOT_NAME = '透视';

  /**
   * 画那张插画的本体（底图 ＋ 叠加层 / 单图 / 文字版）。
   *
   * ★★ **概览那块和「透视」频道共用这一个函数** ✓
   *   ⚠️ 别写第二份 —— 只改一边就会漏出 `[object Object]` 那个破图 BUG ✗
   * @param {object} d 外壳推来的那份 stages
   * @param {boolean} [big] 频道那一页（图更大，见 `.stage-art-big`）
   */
  function stageArtHtml(d, big){
    var title = String(d.title || '');
    var line = String(d.line || '');
    var img = String(d.image || '');
    // ★★ 外壳推来的是**一组图**（底图 ＋ 叠加层，从下往上 ✓）
    //   ⚠️⚠️ 不要多一道 `.map(function(x){ return String(x || ''); })` —— 那是"一层就是一条地址"的
    //     老写法；层是**对象**（底图 / 叠加层带位移 ＋ 缩放）时，String(对象) 会把每一层
    //     变成 "[object Object]" ⇒ 每张都是 `<img src="[object Object]">` ⇒ 底图和所有叠加层全是破图 ✗
    //     ⇒ 只按"有没有 src"过滤（下面那段本来就字符串和对象两种形状都认 ✓）
    var layers = (Array.isArray(d.layers) ? d.layers : []).filter(function(x){
      return (typeof x === 'string') ? !!x : !!(x && x.src);
    });
    // ★★ **左下角的小文字和左上角的冲突，把左下角的删掉** ✓
    //   —— 顶上那块已经写了「透视 ＋ 受精卵着床」，图下面再写一遍标题和一句话就是重复 ✗
    //   ⇒ **只在频道那一页（big）去掉那行**；概览/消息流里那行留着（那边没有顶上的标签 ✓）
    var cap = big ? '' : ('<div class="stage-cap"><span class="stage-name">' + safe(title) + '</span>' +
              (line ? '<span class="stage-capline">' + safe(line) + '</span>' : '') + '</div>');
    var bigCls = big ? ' stage-art-big' : '';
    var body;
    if(layers.length){
      // 底图 + 叠加层：同一画布 ⇒ 一张张绝对定位盖上去 ✓（不写坐标 ✓）
      // ★ 层可以是字符串，也可以带"位移 ＋ 缩放"（胎儿那张：多胎贴几个、按孕周放大 ✓）
      body = '<div class="stage-art stage-art-img stage-art-stack' + bigCls + '">' +
               layers.map(function(l, i){
                 var o = (typeof l === 'string') ? { src: l, dx: 0, dy: 0, s: 1 } : (l || {});
                 var src = String(o.src || '');
                 if(!src) return '';
                 var st = '';

    var zones = parseZones(p.d9[1]);
    var validZones = zones.filter(function(z){ return z.name && z.lv !== ''; });
    var totalLv = 0, cntLv = 0;
    validZones.forEach(function(z){
      var n = parseInt(z.lv, 10);

      '<div class="zone-stats-divider"></div>' +
      '<div class="zone-stats-item"><span>平均</span><span class="zs-num">' + avgLv + '</span><span>级</span></div>' +
    '</div>';
    var inner;
    if(validZones.length){

            '<span class="lv-bar"></span>' +
            safe(z.name) +
            '<span class="pv">' + safe(z.lv) + '级</span>' +
            '<span class="pc" title="累计刺激（每次被碰按轻 1 / 中 2 / 重 3 加起来的总数）">累计刺激 ' + safe(z.count) + '</span>' +

  /**
   * ★ 从「状态条N」那一行的三段里取出**正文**（前三个完全没有描述）。
   *
   * 形状长这样：`状态条一：生理状态 | 生理状态|生殖道腺体…`
   *   —— 前半截那个标签是插件拼的，后半截的值里**模型又把标签抄了一遍**（常见）。
   *   原来这里只取 `tri[1]`，正好取到那个重复的标签 ⇒ 界面上只剩「生理状态」四个字 ✗
   * ⇒ 取第 2 段起、把开头重复的标签段全部丢掉，剩下的用竖线接回去（正文里本来就有竖线也保得住 ✓）
   */
  function bodyRowText(tri, labelName){
    var arr = Array.isArray(tri) ? tri : [];
    var names = [String(arr[0] || '').trim(), String(labelName || '').trim()].filter(Boolean);
    var parts = [];
    for(var i = 1; i < arr.length; i++){
      var s = String(arr[i] || '').trim();
      if(s) parts.push(s);
    }
    while(parts.length && names.indexOf(parts[0]) >= 0) parts.shift();
    return parts.join(' | ');
  }

  /**
   * ★ 「近期性行为」那一行的显示（有点奇怪，这是怎么回事）。
   *
   * 它存的是**三段式**：`时间 & 人物 & 事件`（契约里定的形状，`&` 是给机器对账用的分隔符）⇒
   *   界面上原样印出来就是一串 & ✗ ⇒ 显示时换成「·」接起来。
   *   ⚠️ 只改**显示**：数据一个字符都不动（联系人那边还靠这三段认"和谁做过" ✓）
   */
  function sexRowText(t){
    // ★ 2026-10-26：这一页读的是面板文字原文 ⇒ 日期在显示时换成"今天 / N 天前"
    //   （只影响显示；存档里那份原文不动 ✓）
    try {
      if (typeof window.__bodycordRelDate === 'function') t = window.__bodycordRelDate(t);
    } catch(e){ /* 换算不了就原样显示 */ }
    var lines = String(t || '').split(/\n|[；;]/).map(function(s){ return s.trim(); }).filter(Boolean);
    return lines.map(function(line){
      var seg = line.split('&').map(function(s){ return s.trim(); }).filter(Boolean);
      return seg.length >= 2 ? seg.join(' · ') : line;
    }).join('\n');
  }

  /**
   * ★★ 「身体状态」这一页（状态这一类里、概览下面）。
   *
   * 为什么要有它：三条状态描述原来**只在楼层和推演记录里露过面**，而那两处都是
   *   "这一楼变了什么"的变化视角，主面板没有一个地方能安安静静看"现在是什么样"；
   *   身体痕迹更只有推演报告里那一行。
   *
   * 数据来源两半（面板自己不算任何东西）：
   *   · 三条原文 —— 就在面板文字里（`p.rows`，跟别的页同一个解析结果）
   *   · 痕迹清单 ＋ 每处大约还剩几夜 —— 外壳算好推过来（`__bodycordGetBodyState()`）
   */
  function renderBody(p){
    var rows = p.rows || [];
    // 外壳算好的那份（含痕迹；近期性行为也从记录清单渲染，见 bodyStateForPanel）
    var bsEarly = null;
    try{ bsEarly = (typeof window.__bodycordGetBodyState === 'function') ? window.__bodycordGetBodyState() : null; }catch(e){ bsEarly = null; }
    var defs = [
      { idx:0, label:'生理状态', icon:ICO.period },
      { idx:1, label:'身体状况', icon:ICO.chart },
      { idx:2, label:'近期性行为', icon:ICO.fetus }
    ];
    var parts = [];
    var shown = 0;
    for(var i = 0; i < defs.length; i++){
      var d = defs[i];
      var tri = rows[d.idx] || [];
      var v = bodyRowText(tri, d.label);
      // ★ 2026-10-26：近期性行为这一栏用外壳按记录清单渲染的那份
      //   （面板文字里的 row3 可能写着「无」，但 sexLog 里有记录 ⇒ 整段消失 ✗）
      if(d.idx === 2 && bsEarly && bsEarly.row3) v = String(bsEarly.row3);
      if(d.idx === 2) v = sexRowText(v);
      if(!v || v === '无' || v === '—' || v === '-') continue;
      shown++;
      parts.push('<div class="msg-block">' +
        '<div class="block-head">' +
          '<div class="block-avatar bot">' + d.icon + '</div>' +
          '<span class="block-author">身体状态</span>' +
          '<span class="block-tag">' + safe(d.label) + '</span>' +
        '</div>' +
        '<div class="embed-panel"><div class="body-text">' + nl2br(v) + '</div></div>' +
      '</div>');
    }

    // ---- 身体痕迹（外壳算好那份；面板只负责摆）----
    var bs = null;
    try{ bs = (typeof window.__bodycordGetBodyState === 'function') ? window.__bodycordGetBodyState() : null; }catch(e){ bs = null; }
    var traces = (bs && bs.traces) ? bs.traces : [];
    var items = traces.map(function(x){
      var part = String(x.part || '').trim();
      if(!part) return '';
      var bits = [];
      var kind = String(x.kind || '').trim();
      if(kind) bits.push(safe(kind));
      var lv = String(x.level || '').trim();
      if(lv) bits.push(safe(lv));
      var left = Number(x.nightsLeft);
      if(isFinite(left) && left >= 0) bits.push('<span class="bt-left">约剩 ' + left + ' 夜</span>');
      return '<span class="body-trace-item"><span class="bt-part">' + safe(part) + '</span>' + bits.join(' ') + '</span>';
    }).filter(Boolean).join('');
    parts.push('<div class="msg-block">' +
      '<div class="block-head">' +
        '<div class="block-avatar pin">' + ICO.body + '</div>' +
        '<span class="block-author">身体痕迹</span>' +
        '<span class="block-tag">' + (traces.length ? ('共 ' + traces.length + ' 处') : '暂无') + '</span>' +
      '</div>' +
      (items
        ? '<div class="body-trace">' + items + '</div>'
        : '<div class="empty-state">' + ICO.body + '暂无身体痕迹</div>') +
    '</div>');

    if(!shown && !traces.length){
      return '<div class="empty-state">' + ICO.body + '暂无身体状态</div>';
    }
    return parts.join('');
  }

    var type = 2;
    if(/playlist/i.test(url)) type = 0;
    else if(/album/i.test(url)) type = 1;
    else if(/djradio|radio/i.test(url)) type = 3;
    else if(/song/i.test(url)) type = 2;
    saveLS(LS_NET, url);
    if(!audioPlayer.paused){ audioPlayer.pause(); updateMusicUI(); }
    var iframeUrl = 'https://music.163.com/outchain/player?type=' + type + '&id=' + id + '&auto=0&height=' + (type === 2 ? 66 : (type === 0 ? 430 : 350));
    embed.innerHTML = '<div class="netease-frame"><iframe src="' + iframeUrl + '" allow="autoplay" style="height:' + (type === 2 ? 86 : 430) + 'px"></iframe></div>';
  }
  function noteContentHtml(n){

        (notesList.length

              //   那个类名停在旧值时，聊天里的虚拟时间会被一起藏掉 ✗

                  '<span class="note-delete" onclick="event.stopPropagation(); window.__delNote(\'' + n.id + '\')" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;display:block"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></span>' +
                '</div>' +

                noteImagesHtml(n) +

            }).join('')
          : '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>还没有记录</div>'

  function activatePanel(view){

  function getPanel(view){

  }
  // 请外壳把骰子 UI 挂进来：多敲几次门（外壳可能还没开始监听），
  // 并且超时后把原因写在页面上 —— 空白页对排查毫无帮助。
  function askShellToMountDice(){
    for(var k = 0; k < 3; k++){
      (function(delay){
        setTimeout(function(){
          try{ window.parent.postMessage({__bodycord:true, type:'mountDice'}, '*'); }catch(e){}

      })(k * 280);

    setTimeout(function(){
      var host = document.getElementById('bcDiceMount');
      if(!host) return;
      if(host.querySelector('.bc-embed')) return;          // 正常挂上了
      // ⚠️ 只有在「还停留在载入占位」时才写兜底文案。
      //   外壳可能已经写了更具体的失败原因，别把它盖掉。

        + '把这条消息和浏览器控制台（F12）里的报错一起发给开发者即可。</div>';
    }, 1800);
  }

  // 时光机是个独立窗口（数据多、要左右分栏），所以这个频道点了之后
  // 请外壳把窗口打开，面板里留一个占位 + 一个「再开一次」的按钮。
  var _timeAsked = false;
  function askShellToOpenTime(){
    try{ window.parent.postMessage({__bodycord:true, type:'openTime'}, '*'); }catch(e){}

  function renderTimePanel(){

  /* ═══════════════════════════════════════════════════════════════
     「计时」频道（番茄钟）

     单独一个栏位放计时器 / 倒计时之类，绑定的是现实时间（避免沉迷于酒馆）＋
       **可以全做，然后自定义时间之类的**（理由是：**玩和挂机是不一样的** ✓）；
     位置：就是「工具」这一组里骰子、占卜台那里 ✓

     ⚠️ 跟日历那一页同一个分工：**面板不存真相、也不跑计时** ——
        计时状态、每秒心跳、浏览器通知**全在外壳**（`src/timer.js` + `src/ui.js`）。
        面板只做两件事：把外壳推来的读数画出来 ＋ 把点击转回外壳 ✓
        （两处各存一份"还剩几秒"，迟早对不上 ✗）
     ═══════════════════════════════════════════════════════════════ */
  var timerState = null;        // 外壳推来的那份读数（只读 ✓）
  var timerAsked = false;       // 第一次打开这一页时向外壳要过没有
  var timerMinsDraft = '';      // ★ 自定义分钟数那格里**正在打的字**（重画时要保住它 ✓）

  function postShell(m){
    try{ window.parent.postMessage(m, '*'); }catch(e){}
  }

  function timerSend(action, arg){
    postShell({__bodycord:true, type:'timerAction', action: action, arg: arg});
  }

  /** 现在该整块重画吗？
   *  ⚠️ **不能**每一推都整块重画 —— 外壳**每秒**推一次读数的话，
   *     ⇒ 输入框里的字会被清掉（"填好之后数字就直接消失" ✗）
   *  ⇒ 判据：**只在"没画过 / 要拿第一份读数 / 结构真的变了"时才整块重画**；
   *     其余的每秒推送一律走 `applyTimerReadout()`（只改数字和圆环 ✓） */
  function timerShouldFullRender(host){
    if(!host || !host.dataset.tmRendered) return true;   // 还没画过 ⇒ 必须重画
    // ★★ **正在那一格里打字** ⇒ **绝不整块重画**（重画一定会把输入框换掉 ⇒ 字就没了 ✗）
    //   这就是"不能自定义数字，填好之后数字就直接消失，速度很快"那条报障的真凶之一 ✓
    //   （另一条是"没开始也每秒推"：改成按状态分档 + 没变不推 ✓）
    var inp = host.querySelector('#tmMins');
    if(inp && document.activeElement === inp) return false;
    var st = timerState;
    if(!st) return false;
    // 结构（哪些颗亮着 / 按钮写什么 / 有没有提示行）真的变了 ⇒ 重画一次；
    // ⚠️ 判据里**不许出现 remain**（它每秒都在变 ⇒ 就会每秒重画 ✗）
    var key = timerStructureKey(st);
    return key !== host.dataset.tmKey;
  }

  function renderTimer(){
    var host = getPanel('timer');
    if(!host) return;
    // ⚠️ 有推送时**只更新读数**，别整块重画（详见 `timerShouldFullRender` ✓）
    if(!timerShouldFullRender(host)){ applyTimerReadout(); return; }
    var d = timerState;
    // 第一次打开（或外壳还没推过来）⇒ 先要一份，别显示假数字 ✓
    if(!d){
      if(!timerAsked){ timerAsked = true; postShell({__bodycord:true, type:'timerGet'}); }
      host.innerHTML = '<div class="msg-block bc-timer-block"><div class="block-head">'
        + '<div class="block-avatar timer">' + ICO.timer + '</div>'
        + '<span class="block-author">番茄钟</span>'
        + '<span class="block-tag timer">TIMER</span></div>'
        + '<div class="dice-loading" style="margin:10px 0 0">正在取计时状态…</div></div>';
      return;
    }
    var r = d;
    var work = r.mode !== 'rest';
    var overMs = Number(r.over || 0);
    var remaining = Math.max(0, Math.floor(Number(r.remain || 0) / 1000));
    var totalSec = Math.max(1, Math.floor(Number(r.total || 0) / 1000));
    var timeTxt = fmtTime(remaining);
    var pct = Math.max(0, Math.min(100, Math.round((Number(r.pct) || 0) * 100)));

    /* 新 UI ——
       1. **一眼看得懂的读数**：大圆盘 + 一圈进度（剩余时间就是圆环本身 ✓）
       2. **主按钮只有一个、永远在同一个位置**（开始 / 继续 / 暂停 都它一个，不来回换地方 ✓）
       3. 快选与自定义收成一组、跟"这一段多长"这件事配对 ✓ */
    // 圆环：周长 2πr（r=52）⇒ 用 stroke-dasharray 画进度，一眼看出还剩多少 ✓
    var C = 2 * Math.PI * 52;
    var dash = (C * (100 - pct) / 100).toFixed(1);
    var ringCls = 'bc-timer-ring' + (work ? '' : ' rest') + (r.running ? '' : ' paused');

    // 「专注 / 休息」两档两颗（选中的亮着；**默认那颗排最左** ✓ 项目老规矩）
    var modeChips = '<div class="bc-timer-mini bc-timer-modechip' + (work ? ' on' : '') + '" data-tm-mode="work">专注</div>'
      + '<div class="bc-timer-mini bc-timer-modechip rest' + (work ? '' : ' on') + '" data-tm-mode="rest">休息</div>';
    // 快选那四颗：**设的是"这一段多长"**，跟设置里的默认值不是一回事 ✓
    var quick = '';
    var quicks = [5, 15, 25, 45];
    for(var i = 0; i < quicks.length; i++){
      var m = quicks[i];
      // ★ 选中态＝**这一段长度就是它**（停下时按"还剩多少"判 ✓；别用 total 去比，
      //   那是默认档的长度，玩家选过 5 分钟之后对不上 ✗）
      var on = (!r.running && remaining === m * 60);
      quick += '<div class="bc-timer-mini' + (on ? ' on' : '') + '" data-tm-min="' + m + '">' + m + ' 分</div>';
    }

    /* ⚠️⚠️ 按钮文案的判据＝**是不是真的暂停在一段中间**（外壳给的 `paused`）✓
       —— ⚠️ 拿"剩余 ≠ 默认时长"现算不行：刚选 5 分钟就被当成"跑过一点"⇒ 显示成「继续」✗
          ⚠️ "跑过没有"也不行：**刚选完还没跑**同样是"没跑过"却显示「继续」✗
          ⇒ 只有"暂停"过才写「继续」，其余一律「开始」✓ */
    var goLabel = r.running ? '暂停' : (r.paused ? '继续' : '开始');
    var phase = work ? '专注' : '休息';
    var stateTxt = r.running ? '进行中' : (overMs > 0 ? '这一段结束了' : (r.started ? '已暂停' : '还没开始'));
    //   ⚠️ 这块**不要悬停变灰**（番茄钟的悬停变灰 ✗）⇒ 给它一个自己的类，样式里排除掉 ✓
    var html = '<div class="msg-block bc-timer-block">'
      + '<div class="block-head">'
        + '<div class="block-avatar timer">' + ICO.timer + '</div>'
        + '<span class="block-author">番茄钟</span>'
        + '<span class="block-tag timer">TIMER</span>'
      + '</div>'
      + '<div class="player-card bc-timer-card">'
        + '<div class="bc-timer-dial ' + ringCls + '">'
          + '<svg viewBox="0 0 120 120" class="bc-timer-svg">'
            + '<circle class="bc-timer-track" cx="60" cy="60" r="52"></circle>'
            + '<circle class="bc-timer-prog" cx="60" cy="60" r="52" stroke-dasharray="' + dash + ' ' + C.toFixed(1) + '"></circle>'
          + '</svg>'
          + '<div class="bc-timer-face">'
            + '<div class="bc-timer-time">' + safe(timeTxt) + '</div>'
            + '<div class="bc-timer-phase">' + phase + '</div>'
            + '<div class="bc-timer-state">' + stateTxt + '</div>'
          + '</div>'
        + '</div>'
        + '<div class="bc-timer-row bc-timer-row-center">' + modeChips + '</div>'
        + '<div class="bc-timer-row bc-timer-row-center">'
          + '<button class="bc-timer-go' + (r.running ? ' stop' : '') + '" data-tm-go="1">' + goLabel + '</button>'
          + '<button class="bc-timer-mini bc-timer-reset" data-tm-reset="1" title="重来当前这一段，长度不变">重来</button>'
        + '</div>'
        + '<div class="bc-timer-sep"></div>'
        + '<div class="bc-timer-label">这一段多久</div>'
        + '<div class="bc-timer-row">' + quick + '</div>'
        + '<div class="bc-timer-row">'
          + '<input class="bc-timer-mins" id="tmMins" type="number" min="1" max="600" placeholder="自定" value="' + safe(timerMinsDraft) + '">'
          + '<div class="bc-timer-mini" data-tm-set="1">用这个数</div>'
        + '</div>'
        + '<div class="bc-timer-stats">默认 专注 <b>' + Number(r.work || 25) + '</b> 分钟、休息 <b>' + Number(r.rest || 5) + '</b> 分钟'
          + '　·　今天完成 ' + (Number(r.rounds) || 0) + ' 轮'
          + '　·　时长在设置 → 时间与日历 → 番茄钟里改'
          + (String(r.perm || '') === 'granted' ? '　·　到点会弹通知' : '')
        + '</div>'
        // ★★ 番茄钟要有一个"打开之后关闭番茄钟悬浮球"的选项 ⇒ 按键做在这里 ✓
        //   ⇒ **就地收掉现在这颗球**（只活这一轮、不落设置）；设置里那颗"要不要有番茄钟悬浮球"
        //     的总体开关照旧留着 ✓（这里不是整体开关，说的是隐藏掉现在的这颗 ✓）
        + (r.ball ? ('<div class="bc-timer-row bc-timer-row-center" style="margin-top:8px">'
            + '<div class="bc-timer-mini" data-tm-ballhide="1" title="只收掉现在这颗，不影响设置里那个总开关">'
            + (r.ballHidden ? '显示悬浮球' : '隐藏悬浮球') + '</div></div>') : '')
      + '</div>'
      + '</div>';

    // 通知权限：只报状态，**不打扰**（给了就不用再看这一行 ✓）
    var perm = String(r.perm || '');
    if(perm === 'default'){
      html += '<div class="bc-timer-warn">到点了只会在页内提醒。想要电脑右下角 / 手机通知栏也弹，'
        + '<span class="bc-timer-mini" data-tm-perm="1" style="margin-left:6px">开启通知</span></div>';
    }else if(perm === 'denied'){
      html += '<div class="bc-timer-warn">浏览器把通知关掉了，到点只在页内提醒。想开的话去浏览器的网站设置里允许通知</div>';
    }else if(perm === 'unsupported'){
      html += '<div class="bc-timer-warn">这个浏览器不支持系统通知，到点只在页内提醒</div>';
    }

    host.innerHTML = html;
    // ★ 记下"这一版是照着哪份结构画的" ⇒ 下一次推送要是结构没变就只更新读数（不清输入框 ✓）
    host.dataset.tmRendered = '1';
    host.dataset.tmKey = timerStructureKey(r);
    bindTimerEvents(host);
    // 重画之后把焦点还给那个输入框（正在打字的话别被抢走 ✓）
    if(host.dataset.tmWantFocus){
      var inp = host.querySelector('#tmMins');
      if(inp){ try{ inp.focus(); }catch(e){} }
    }
  }

  /** 结构指纹（**只放"会改变页面长相"的东西**；⚠️ 绝不能放 remain —— 它每秒都在变 ✓） */
  function timerStructureKey(r){
    if(!r) return '';
    return [r.mode, r.running ? 1 : 0, r.paused ? 1 : 0,
      // 快选那一颗亮不亮是按"整分钟"判的 ⇒ 只取整分钟
      Math.floor(Number(r.remain || 0) / 60000),
      Number(r.rounds) || 0, String(r.perm || ''), Number(r.work) || 0, Number(r.rest) || 0,
      // ★ 那颗「隐藏 / 显示悬浮球」按钮的字要跟着状态变 ⇒ 也算结构键 ✓
      r.ball ? 1 : 0, r.ballHidden ? 1 : 0].join('|');
  }

  /** ★ 只更新读数那几处（数字 / 圆环 / 按钮 / 状态字）—— **不碰输入框、不碰焦点** ✓
   *  这就是"每秒推一次也不用整块重画"的那条路（输入内容消失那条报障就是整块重画害的 ✓） */
  function applyTimerReadout(){
    var host = getPanel('timer');
    if(!host) return;
    var r = timerState;
    if(!r) return;
    var work = r.mode !== 'rest';
    var overMs = Number(r.over || 0);
    var remaining = Math.max(0, Math.floor(Number(r.remain || 0) / 1000));
    var pct = Math.max(0, Math.min(100, Math.round((Number(r.pct) || 0) * 100)));
    var timeTxt = fmtTime(remaining);
    var C = 2 * Math.PI * 52;
    var dash = (C * (100 - pct) / 100).toFixed(1);
    var set = function(sel, fn){ var el = host.querySelector(sel); if(el) fn(el); };
    set('.bc-timer-time', function(el){ if(el.textContent !== timeTxt) el.textContent = timeTxt; });
    set('.bc-timer-prog', function(el){ el.setAttribute('stroke-dasharray', dash + ' ' + C.toFixed(1)); });
    set('.bc-timer-dial', function(el){
      el.classList.toggle('rest', !work);
      el.classList.toggle('paused', !r.running);
    });
    var phase = work ? '专注' : '休息';
    var stateTxt = r.running ? '进行中' : (overMs > 0 ? '这一段结束了' : (r.paused ? '已暂停' : '还没开始'));
    set('.bc-timer-phase', function(el){ if(el.textContent !== phase) el.textContent = phase; });
    set('.bc-timer-state', function(el){ if(el.textContent !== stateTxt) el.textContent = stateTxt; });
    var goLabel = r.running ? '暂停' : (r.paused ? '继续' : '开始');
    set('[data-tm-go]', function(el){
      if(el.textContent !== goLabel) el.textContent = goLabel;
      el.classList.toggle('stop', !!r.running);
    });
    // 结构要是真变了（比如按钮该换成"继续"、或快选那一颗该亮起来）⇒ 走完整重画 ✓
    if(host.dataset.tmKey !== timerStructureKey(r)) renderTimer();
  }

  function bindTimerEvents(host){
    /* ⚠️⚠️ **点击监听只许挂一次** ✓
       写在 renderTimer 末尾（每次重画都挂一遍）的话，外壳**每秒推一次读数 ⇒ 每秒重画一次**
       ⇒ 点一下实际跑了好几个处理器 ⇒ 状态被反复覆盖
       （现象是"点 5 分钟却还是 1500 秒"、"点了像没反应"）✗
       ⇒ 现在：点击挂在 **host 上、只挂一次**（host 本身不会被替换，只有它的 innerHTML 会 ✓）；
          里面那些**每次重画都会新建**的元素（比如自定义分钟那个输入框）才在下面单独挂 ✓ */
    if(!host.dataset.tmBound){
      host.dataset.tmBound = '1';
      host.addEventListener('click', function(ev){
        var el = ev.target;
        /* ⚠️⚠️ 不要用**写死的白名单**
           （data-tm-go / reset / mode / min / set / perm）：新加的 `data-tm-ballhide`
           没登记就 ⇒ 往上找时一路找不到、走到 host 就 return ⇒ **点击被静默吞掉**（"隐藏不掉" ✗）
           ⇒ 认所有 `data-tm-` 前缀（以后再加按钮不用记得来登记 ✓），
             具体动作仍由下面那些 `if(el.getAttribute('data-tm-xxx'))` 决定 ✓ */
        function hasTmAttr(n){
          try{
            var at = (n && n.attributes) || [];
            for(var i = 0; i < at.length; i++){ if(String(at[i].name || '').indexOf('data-tm-') === 0) return true; }
          }catch(e){}
          return false;
        }
        while(el && el !== host && !hasTmAttr(el)) el = el.parentNode;
        if(!el || el === host) return;
        if(el.getAttribute('data-tm-go')){
          // ★ 主按钮：**交给外壳判**"该开始还是该停"（外壳手上那份才是准的 ✓）
          //   ⚠️ 面板自己拿 `timerState.running` 猜不行：面板那份要是还没收到最新推送就会猜错
          //     （点了"5 分钟"之后立刻点主按钮，发出去的会是「暂停」✗）
          timerSend('toggle');
          return;
        }
        if(el.getAttribute('data-tm-reset')){ timerSend('reset'); return; }
        // ★ 就地收掉 / 放回番茄钟悬浮球（不落设置 ✓）
        if(el.getAttribute('data-tm-ballhide')){ timerSend('ballHide'); return; }
        // ★ 「专注 / 休息」和「这一段多久」都是**只选中、不开跑**：
        //   **点击数字/专注/休息不要直接开始。这不符合常理。** ✓ —— 选长度和"开始"是两件事
        if(el.getAttribute('data-tm-mode')){ timerSend('pickMode', el.getAttribute('data-tm-mode')); return; }
        if(el.getAttribute('data-tm-min')){ timerSend('pick', Number(el.getAttribute('data-tm-min'))); return; }
        if(el.getAttribute('data-tm-perm')){ postShell({__bodycord:true, type:'timerPerm'}); return; }
        if(el.getAttribute('data-tm-set')){
          // 「用这个数」那颗：**跟"填了就算数"同一套**（不这么写就会"填完就消失" ✗）
          //   ⇒ 交出去的永远是同一个 `commitTimerMins`，而且**不再清空输入框** ✓
          if(!commitTimerMins(host)) showToast('先填一个分钟数');
          return;
        }
      });
    }
    // 输入框是每次重画都会新建的 ⇒ 这一下每次都要挂（它不是"叠加"，是跟着新元素走 ✓）
    var inp = host.querySelector('#tmMins');
    if(inp){
      /** ★★「**填了就算数**」—— ⚠️ **不能自定义数字、填好之后数字就直接消失**就是在这里没做好 ✗
       *  两件事一起治：
       *   ① 填完**不用再点**那颗「用这个数」（分两步本来就不顺）；
       *   ② 把正在打的字记进 `timerMinsDraft`，**整块重画时带回来**、而且重画后焦点还给它 ✓
       *  ⚠️ 只在"能读成一个正经分钟数"时才送出去 —— 打一半（比如刚敲个 `1` 想打 `15`）别乱设 ✓ */
      var commitSoon = null;
      var commit = function(){
        if(commitSoon){ clearTimeout(commitSoon); commitSoon = null; }
        commitTimerMins(host);
      };
      // 打字：**按住不急着设**（停 700ms 再送），免得"1"还没打完就先按 1 分钟设了一次 ✓
      inp.addEventListener('input', function(){
        host.dataset.tmWantFocus = '1';
        timerMinsDraft = String(inp.value || '').trim();
        if(commitSoon) clearTimeout(commitSoon);
        commitSoon = setTimeout(commit, 700);
      });
      // 按回车 / 离开这一格：立刻算数 ✓
      inp.addEventListener('keydown', function(ev){
        if(ev.key !== 'Enter') return;
        ev.preventDefault();
        commit();
      });
      inp.addEventListener('blur', function(){ commit(); });
    }
  }

  /** 把自定义分钟数那一格读出来（读不出来就是 NaN ✓） */
  function timerMinsValue(host){
    var inp = host.querySelector('#tmMins');
    return inp ? Number(String(inp.value || '').trim()) : NaN;
  }

  /** ★ 「填了就算数」的那一下（输入 / 回车 / 失焦 / 点那颗按钮，**四处共用这一个** ✓）
   *  @returns 是否真的设下去了（拿来决定要不要弹"先填一个分钟数"） */
  function commitTimerMins(host){
    var v = timerMinsValue(host);
    var inp = host.querySelector('#tmMins');
    if(inp) timerMinsDraft = String(inp.value || '').trim();
    if(!isFinite(v) || v <= 0) return false;
    timerSend('pick', Math.max(1, Math.min(600, Math.round(v))));
    return true;
  }

  /** 外壳推读数过来（每次它那儿一变就推一下 ✓） */
  window.__bodycordTimerSet = function(d){
    timerState = d || null;
    try{ if(currentView === 'timer') renderTimer(); }catch(e){}
  };

  /* ═══════════════════════════════════════════════════════════════
     「日历」频道（写备注 / 圈红圈 / 到点有提醒）

     ⚠️ 这一页的 **HTML 是外壳算好的**（`CALENDAR.html`）——
        面板里**不重建一份日期引擎** ✓（同一个东西两份真相迟早打架 ✗）
        面板只管两件事：挂上去 ＋ 把点击转回外壳 ✓
        （翻月 / 写备注 / 切节日 / 关提示，全都由外壳重算再推回来）
     ═══════════════════════════════════════════════════════════════ */
  window.__bodycordCalendarChanged = function(){
    try{ if(currentView === 'calendar') renderCalendarPanel(); }catch(e){}
  };

  /* ★ 悬浮球那个「提醒气泡」要靠外壳来问两件事 ——
     ① 现在在哪一页（日历页正开着 ⇒ 那页顶上已经有横幅了，气泡别再重复提醒 ✓）
     ② 帮我翻到某一页（点气泡 ⇒ 直接带到日历那一页 ✓）
     ⚠️ 只读 / 只切页面，不碰任何数据 ✓ */
  window.__bodycordGetView = function(){ return currentView; };
  window.__bodycordSwitchView = function(v){ try{ switchView(String(v || 'overview')); }catch(e){} };

  var _calBound = false;
  function postCal(m){ try{ window.parent.postMessage(m, '*'); }catch(e){} }

  /* ── 下半部分那几条日程：**面板不存真相**，改完 postMessage 回外壳写 ✓ ──
     ⚠️ 保存**不整页重画**（整页重画会把正在打字的输入框连焦点一起干掉 ✗）——
        外壳只把"格子上那圈红圈 + 那行小字"回过来，我们贴一下就算 ✓ */
  var _calSaveT = null;
  var _calPendRow = null;      // 还等着存的那一行（重画之前得先把它存掉，别丢字 ✓）
  var _calFocusNew = false;    // 刚点了「＋ 加一条」⇒ 画完把新那格聚焦 ✓

  function calRowOf(el){
    var t = el;
    while(t && t !== document && !(t.getAttribute && t.getAttribute('data-cal-ev'))) t = t.parentNode;
    return (t && t.getAttribute && t.getAttribute('data-cal-ev')) ? t : null;
  }

  /** 把这一行现在的内容读出来（**只读存在的那几格** ⇒ 不动没显示的字段 ✓） */
  function calRowValues(row){
    if(!row) return null;
    var box = row.parentNode;
    while(box && box !== document && !(box.getAttribute && box.getAttribute('data-cal-date'))) box = box.parentNode;
    if(!box || !box.getAttribute) return null;
    var v = { id: row.getAttribute('data-cal-ev') || '', date: box.getAttribute('data-cal-date') || '' };
    v.allDay = row.getAttribute('data-cal-all') === '1';
    v.remind = row.getAttribute('data-cal-rem') !== '0';   // ★ 这条要不要提醒 ✓
    var keys = ['start','end','title','note'];   // ★ A8：标题也读（可留空）
    for(var i=0;i<keys.length;i++){
      var el = row.querySelector('[data-cal-f="' + keys[i] + '"]');
      if(el) v[keys[i]] = el.value;      // ⚠️ 没有这格就不写它（别把存着的时间抹掉 ✗）
    }
    return (v.id && v.date) ? v : null;
  }

  function calFlush(){                 // 立刻把挂着的那次保存发出去
    if(_calSaveT){ clearTimeout(_calSaveT); _calSaveT = null; }
    var row = _calPendRow;
    _calPendRow = null;
    var v = row ? calRowValues(row) : null;
    if(v) postCal({__bodycord:true, type:'calendarSave', entry:v});
  }

  function calSaveSoon(row){           // 打字停下来再存（别每敲一键就写盘 ✓）
    _calPendRow = row;
    if(_calSaveT) clearTimeout(_calSaveT);
    _calSaveT = setTimeout(calFlush, 600);
  }

  /** 保存完只贴一下那一格（红圈 + 小字）——不整页重画 ⇒ 输入框不失焦 ✓ */
  function patchCalCell(day, label){
    if(!day) return;
    var wrap = document.querySelector('.bc-cal-wrap');
    if(!wrap || wrap.querySelector('.bc-cal-scroll')) return;    // 跨月视图里同号的日子有好几个 ⇒ 不贴 ✓
    var cells = wrap.querySelectorAll('.bc-cal-cell[data-cal-day="' + day + '"]');
    for(var i=0;i<cells.length;i++){
      var cell = cells[i];
      var cls = String(cell.className || '').replace(/\s*bc-cal-mark/g, '');
      var n = cell.querySelector('.bc-cal-n');
      if(label){
        cell.className = cls + ' bc-cal-mark';
        if(!n){ n = document.createElement('div'); n.className = 'bc-cal-n'; cell.appendChild(n); }
        n.textContent = label;
      }else{
        cell.className = cls;
        if(n && n.parentNode) n.parentNode.removeChild(n);
      }
    }
  }

  function calWarn(row, msg){
    if(!row) return;
    var box = row.querySelector('.bc-cal-ev-warn');
    if(box) box.textContent = msg || '';
  }

  /** 外壳存完回话（照 __bodycordNotesImageResult 那套 ✓） */
  window.__bodycordCalendarSaved = function(res){
    try{
      if(!res) return;
      var row = res.id ? document.querySelector('.bc-cal-ev[data-cal-ev="' + res.id + '"]') : null;
      if(res.warn) calWarn(row, res.warn);
      else calWarn(row, '');
      if(res.day) patchCalCell(Number(res.day), String(res.label || ''));
    }catch(e){}
  };

  function bindCalendarEvents(host){
    if(!host || _calBound) return;
    _calBound = true;
    host.addEventListener('click', function(ev){
      var t = ev.target;
      var pickAttr = function(el, k){ return (el && el.getAttribute) ? el.getAttribute(k) : null; };
      while(t && t !== host
            && !(pickAttr(t, 'data-cal-day') || pickAttr(t, 'data-cal-nav')
                 || pickAttr(t, 'data-cal-holidays') || pickAttr(t, 'data-cal-dismiss')
                 || pickAttr(t, 'data-cal-jump') || pickAttr(t, 'data-cal-today')
                 || pickAttr(t, 'data-cal-due')
                 || pickAttr(t, 'data-cal-mode')
                 || pickAttr(t, 'data-cal-add') || pickAttr(t, 'data-cal-del')
                 || pickAttr(t, 'data-cal-allday') || pickAttr(t, 'data-cal-remind'))){
        t = t.parentNode;
      }
      if(!t || t === host) return;
      var d = (typeof window.__bodycordGetCalendar === 'function') ? window.__bodycordGetCalendar() : null;
      var months = (d && d.months) ? d.months : 12;
      var day = pickAttr(t, 'data-cal-day');
      var nav = pickAttr(t, 'data-cal-nav');
      var hol = pickAttr(t, 'data-cal-holidays');
      var dis = pickAttr(t, 'data-cal-dismiss');
      var jmp = pickAttr(t, 'data-cal-jump');
      var tdy = pickAttr(t, 'data-cal-today');
      var duej = pickAttr(t, 'data-cal-due');
      var cmd = pickAttr(t, 'data-cal-mode');
      var add = pickAttr(t, 'data-cal-add');
      var del = pickAttr(t, 'data-cal-del');
      var all = pickAttr(t, 'data-cal-allday');
      var rem = pickAttr(t, 'data-cal-remind');
      // 点的那一格在**哪个月**：跨月视图里有 3 个月，格子上自己带着年/月 ✓
      var grid = t;
      while(grid && grid !== host && !(grid.getAttribute && grid.getAttribute('data-cal-y'))) grid = grid.parentNode;
      var gy = (grid && grid.getAttribute) ? grid.getAttribute('data-cal-y') : null;
      var gm = (grid && grid.getAttribute) ? grid.getAttribute('data-cal-m') : null;
      if(t === host) return;
      if(del){                       // 「✕」删掉这一条
        var rowD = calRowOf(t);
        var boxD = rowD;
        while(boxD && boxD !== document && !(boxD.getAttribute && boxD.getAttribute('data-cal-date'))) boxD = boxD.parentNode;
        if(_calPendRow === rowD) { if(_calSaveT){ clearTimeout(_calSaveT); _calSaveT = null; } _calPendRow = null; }
        postCal({__bodycord:true, type:'calendarDel', id: String(del),
                 date: (boxD && boxD.getAttribute) ? (boxD.getAttribute('data-cal-date') || '') : ''});
      }
      else if(all){                  // 「全天 / 具体时间」两档（拆两颗，别做成一件事 ✗）
        var rowA = calRowOf(t);
        if(rowA){
          var wantAllDay = pickAttr(t, 'data-allday-v') === '1';
          rowA.setAttribute('data-cal-all', wantAllDay ? '1' : '0');
          var chips = rowA.querySelectorAll('.bc-cal-ev-clock, .bc-cal-ev-tilde');
          for(var k=0;k<chips.length;k++){
            var c = chips[k];
            c.className = wantAllDay ? (String(c.className).replace(/\s*off/g, '') + ' off')
                                     : String(c.className).replace(/\s*off/g, '');
          }
          var allChips = rowA.querySelectorAll('.bc-cal-ev-all');
          for(var ac=0; ac<allChips.length; ac++){
            var acc = allChips[ac];
            var selA = (acc.getAttribute('data-allday-v') === '1') === wantAllDay;
            acc.className = selA ? 'bc-cal-ev-all on' : 'bc-cal-ev-all';
          }
          calSaveSoon(rowA);
          calFlush();
        }
      }
      else if(rem){                  // ★ 两档：不应该做成一个按钮，做成两个 ✓
        var rowR = calRowOf(t);
        if(rowR){
          var wantR = pickAttr(t, 'data-remv') === '1';
          rowR.setAttribute('data-cal-rem', wantR ? '1' : '0');
          var rchips = rowR.querySelectorAll('.bc-cal-ev-remind');
          for(var ri=0; ri<rchips.length; ri++){
            var rc = rchips[ri];
            var selR = (rc.getAttribute('data-remv') === '1') === wantR;
            rc.className = selR ? 'bc-cal-ev-remind on' : 'bc-cal-ev-remind';
          }
          calSaveSoon(rowR);
          calFlush();
        }
      }
      else if(add){                  // 「＋ 加一条」：加完把新那格聚焦（下面 _calFocusNew ✓）
        var boxA = t;
        while(boxA && boxA !== document && !(boxA.getAttribute && boxA.getAttribute('data-cal-date'))) boxA = boxA.parentNode;
        _calFocusNew = true;
        postCal({__bodycord:true, type:'calendarAdd',
                 date: (boxA && boxA.getAttribute) ? (boxA.getAttribute('data-cal-date') || '') : ''});
      }
      else if(day) postCal({__bodycord:true, type:'calendarPick', day: Number(day),
                            y: gy ? Number(gy) : null, m: gm ? Number(gm) : null});
      else if(nav) postCal({__bodycord:true, type:'calendarNav', step: Number(nav), months: months});
      else if(jmp) postCal({__bodycord:true, type:'calendarJump'});
      else if(tdy) postCal({__bodycord:true, type:'calendarToday'});
      else if(duej) postCal({__bodycord:true, type:'calendarDueJump'});
      else if(cmd) postCal({__bodycord:true, type:'calendarMode', mode: String(cmd)});
      else if(hol) postCal({__bodycord:true, type:'calendarHolidays'});
      else if(dis) postCal({__bodycord:true, type:'calendarDismiss', keys: dis});
    });

    // 打字：停一下再存 ✓
    host.addEventListener('input', function(ev){
      var el = ev.target;
      if(!el || !el.getAttribute || !el.getAttribute('data-cal-f')) return;
      var row = calRowOf(el);
      if(row) calSaveSoon(row);
    });
    // 离开那一行才算"改完了"（点同一条里的下一个格子不算离开 ⇒ 别在这时候重画 ✓）
    host.addEventListener('focusout', function(ev){
      var el = ev.target;
      if(!el || !el.getAttribute || !el.getAttribute('data-cal-f')) return;
      var row = calRowOf(el);
      var to = ev.relatedTarget;
      if(row && to && row.contains(to)) return;
      calFlush();                                   // 先把挂着的那次存掉 ✓
      if(row){ _calPendRow = row; calFlush(); }     // 这一条也存一次 ✓
    });
    // 回车 = 立刻存（顺手把光标留在这一格 ✓）
    host.addEventListener('keydown', function(ev){
      if(ev.key !== 'Enter') return;
      var el = ev.target;
      if(!el || !el.getAttribute || !el.getAttribute('data-cal-f')) return;
      ev.preventDefault();
      var row = calRowOf(el);
      if(row){ _calPendRow = row; calFlush(); }
    });
  }

  var _calFocusNew = false;      // 刚点了「＋ 加一条」⇒ 画完把新那格聚焦 ✓

  function renderCalendarPanel(){
    var host = getPanel('calendar');
    if(!host) return;
    var d = (typeof window.__bodycordGetCalendar === 'function') ? window.__bodycordGetCalendar() : null;
    if(!d || !d.html){
      host.innerHTML = '<div class="empty-state">日历还没算出来。<br>进聊天里再点这一页试试</div>';
      return;
    }
    // ⚠️ 重画之前先把还挂着的改动存掉（不存就等于把人家刚打的字吞了 ✗）
    try{ calFlush(); }catch(e){}
    host.innerHTML = d.html;
    bindCalendarEvents(host);
    // ★ 刚点了「加一条」⇒ 把**那条空的**聚焦，好直接打字 ✓
    //   （⚠️ 别用"最后一行"：新加的那条是全天、排序在最前面 ✗）
    if(_calFocusNew){
      _calFocusNew = false;
      try{
        var all = host.querySelectorAll('.bc-cal-ev');
        var target = null;
        for(var i=0;i<all.length;i++){
          var nIn = all[i].querySelector('[data-cal-f="note"]');
          var sIn = all[i].querySelector('[data-cal-f="start"]');
          if(nIn && !String(nIn.value || '').trim() && !(sIn && String(sIn.value || '').trim())) target = nIn;
        }
        if(target) target.focus();
      }catch(e){}
    }
    // ★ 跨月视图：进来就滚到「看的那个月」那一段
    //   （不然一开就停在上一个月上 ✗ —— 外壳在那一段上标了 data-cal-focus ✓）
    try{
      var focus = host.querySelector('[data-cal-focus]');
      var box = host.querySelector('.bc-cal-scroll');
      if(focus && box){
        var top = (focus.offsetTop || 0) - (box.offsetTop || 0);
        if(top > 0) box.scrollTop = top;
      }
    }catch(e){}
  }

  function renderMain(){
    // ★ 「日历」：HTML 由外壳算好，这里只负责挂 ✓

  function collectSearchSources(){
    var out = [];
    var p = currentProfile;
    if(p){
      var names = {title:'状态标题', phase:'阶段名', sub:'进度', minor:'次要描述', calc:'计算说明',
                   d1:'d1 阶段基础率', d2:'d2 累计受孕率', d3:'d3 体质系数', d4:'d4 致孕方',
                   d5:'d5 意识状态', d6:'d6 胎儿状态', d7:'d7 泌乳状态', d8:'d8 生产次数',
                   d9:'d9 敏感带'};
      for(var k in names){
        var v = p[k];
        if(v) out.push({ group:'状态', key:names[k], val:String(v), view: viewForKey(k) });
      }
      // ★ 三条状态描述解析出来是放在 `rows` 数组里的（不是 p.row1 这种属性）⇒
      //   原来这 map 里写着 row1/row2/row3，可 `p.row1` 永远是 undefined ⇒ 这三行一直搜不到 ✗
      //   ⇒ 改成按数组读，并且点搜索结果直接跳到「身体状态」那一页 ✓
      var rowNames = ['生理状态', '身体状况', '近期性行为'];
      for(var ri = 0; ri < 3; ri++){
        var tri = (p.rows || [])[ri] || [];
        var rv = bodyRowText(tri, rowNames[ri]);
        if(rv) out.push({ group:'身体状态', key:rowNames[ri], val:rv, view:'body' });
      }
    }
    // 月经面板
    if(currentPeriods && currentPeriods[0]){
      var pd = currentPeriods[0];
      for(var pk in pd){ if(pd[pk]) out.push({ group:'生理监测', key:pk, val:String(pd[pk]), view:'period' }); }
    }
    // 随手记
    for(var i = 0; i < (notesList||[]).length; i++){
      var n = notesList[i];
      out.push({ group:'随手记（' + notesScopeLabel() + '）', key: (n.time || ('第 ' + (i+1) + ' 条')), val: String(n.text || n.content || ''), view:'notes' });
    }
    // 敏感带备注
    try{
      for(var j = 0; j < localStorage.length; j++){
        var lk = localStorage.key(j);
        if(lk && lk.indexOf(LS_ZONE_NOTE_PREFIX) === 0){
          var zv = loadLS(lk);
          if(zv) out.push({ group:'敏感带备注', key: lk.slice(LS_ZONE_NOTE_PREFIX.length), val:String(zv), view:'zones' });
        }
      }
    }catch(e){}
    // 历史笔记
    var hist = [];
    try{ hist = JSON.parse(loadLS(LS_DIV_HISTORY) || '[]') || []; }catch(e){ hist = []; }
    for(var h = 0; h < hist.length; h++){
      var it = hist[h];
      out.push({ group:'推演记录', key:(it.time || ('#' + (h+1))), val:String(it.raw || ''), view:'overview' });
    }
    return out;
  }

  function viewForKey(k){
    if(k === 'd6' || k === 'row1' && false) return 'fetus';
    if(k === 'd9') return 'zones';
    if(k === 'd6') return 'fetus';
    return 'overview';
  }

  window.runSearch = function(){
    var box = $('searchResults');
    var q = String($('searchInput').value || '').trim().toLowerCase();
    if(!q){ box.innerHTML = '<div class="search-empty">输入点什么开始搜</div>'; return; }

    var all = collectSearchSources();
    var hits = [];
    for(var i = 0; i < all.length; i++){
      var a = all[i];
      var hay = (a.key + ' ' + a.val).toLowerCase();
      if(hay.indexOf(q) < 0) continue;
      hits.push(a);
    }
    if(!hits.length){ box.innerHTML = '<div class="search-empty">没找到「' + safe(q) + '」</div>'; return; }

    var html = '', lastGroup = '';
    for(var h = 0; h < hits.length; h++){
      var it = hits[h];
      if(it.group !== lastGroup){ html += '<div class="search-group">' + safe(it.group) + '</div>'; lastGroup = it.group; }
      html += '<div class="search-hit" data-view="' + safe(it.view) + '">' +
                '<div class="search-hit-key">' + safe(it.key) + '</div>' +
                '<div class="search-hit-val">' + highlight(it.val, q) + '</div>' +
              '</div>';
    }
    box.innerHTML = html;
    var items = box.querySelectorAll('.search-hit');
    for(var t = 0; t < items.length; t++){
      items[t].addEventListener('click', function(){
        var v = this.dataset.view || 'overview';
        closeSearch();
        switchView(v);
        closeDrawer();
      });
    }
  };

  function highlight(text, q){
    var t = safe(text);
    if(!q) return t;
    var idx = t.toLowerCase().indexOf(q);
    if(idx < 0) return t;
    return t.slice(0, idx) + '<mark>' + t.slice(idx, idx + q.length) + '</mark>' + t.slice(idx + q.length);
  }

  /* ★★ 手机形态：侧栏改「抽屉」（手机上也要能用 ⇒ 补出手机形态）——
     判据是**可用宽度 / 高度**（matchMedia），不是认 UA：酒馆在手机上也是网页，UA 不可靠，
     而且这样桌面把窗口拖窄也会自动是手机形态 ✓
     ⚠️ 这个字符串必须和 `style.css`、`src/ui.js` 里那两处**逐字相同**
        （① 窄屏 ＝ 竖着拿的手机；② 触屏 ＋ 矮屏 ＝ 横着拿的手机，见上面 <style> 那段说明）✓
     开合只加一个类（`.drawer-open`），形态全交给 CSS；三个关法：点频道 / 点遮罩 / ESC ✓ */
  var PHONE_MQ = window.matchMedia ? window.matchMedia('(max-width: 560px), (hover: none) and (max-height: 520px)') : null;
  function isPhoneForm(){ return !!(PHONE_MQ && PHONE_MQ.matches); }
  function drawerOpen(){ return app.classList.contains('drawer-open'); }
  function openDrawer(){ if(isPhoneForm() && !drawerOpen()) app.classList.add('drawer-open'); }
  function closeDrawer(){ if(drawerOpen()) app.classList.remove('drawer-open'); }
  function toggleDrawer(){ if(drawerOpen()) closeDrawer(); else openDrawer(); }
  /* ★★ 面板自己的输入框 ——
     ⚠️ 系统弹窗（`window.prompt`）在**安卓 WebView（TT 手机端）**里要靠宿主实现 `onJsPrompt`，
     没实现就是**静默返回空**（点了没反应、也不报错 ✗）⇒ 面板里那几处全换成自己的 ✓
     ⚠️ ESC／回车用**捕获 + stopImmediatePropagation**：不然面板自己那个"ESC 关面板"会跟着一起触发 ✗ */
  function bcAskText(title, value, maxLen, onOk){
    var ov = document.createElement('div');
    ov.className = 'bc-in-overlay';
    var box = document.createElement('div');
    box.className = 'bc-in-box';
    box.innerHTML =
      '<div class="bc-in-title"></div>' +
      '<input class="bc-in-input" type="text">' +
      '<div class="bc-in-foot"><button class="bc-in-ok">确定</button><button class="bc-in-no">取消</button></div>';
    box.querySelector('.bc-in-title').textContent = String(title || '');
    var inp = box.querySelector('.bc-in-input');
    inp.value = (value == null ? '' : String(value));
    if(maxLen > 0) inp.setAttribute('maxlength', String(maxLen));
    ov.appendChild(box);
    document.body.appendChild(ov);

    var closed = false;
    function close(){
      if(closed) return;
      closed = true;
      try{ ov.remove(); }catch(e){}
      document.removeEventListener('keydown', onKey, true);
    }
    function ok(){
      var v = String(inp.value == null ? '' : inp.value);
      close();
      try{ onOk(v); }catch(e){}
    }
    function onKey(ev){
      if(ev.key === 'Escape'){ ev.preventDefault(); ev.stopImmediatePropagation(); close(); }
      else if(ev.key === 'Enter'){ ev.preventDefault(); ev.stopImmediatePropagation(); ok(); }
    }
    box.querySelector('.bc-in-ok').onclick = ok;
    box.querySelector('.bc-in-no').onclick = close;
    ov.addEventListener('mousedown', function(ev){ if(ev.target === ov) close(); });
    document.addEventListener('keydown', onKey, true);
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 0);
  }

  // ★ 读一个文件夹 + 配对同名 .lrc（这段要在"选择文件夹 / 恢复 / 刷新"三处用 ⇒
  //   各抄一遍迟早漂 ✗ ⇒ 抽成一个 ✓）
  async function scanMusicFolder(handle){
    var files = [];
    var lrcMap = {};
    for await (var entry of handle.values()){
      if(entry.kind === 'file'){
        var f = await entry.getFile();
        if(/\.lrc$/i.test(f.name)){
          var base = f.name.replace(/\.lrc$/i, '');
          lrcMap[base] = await f.text();
        } else if(/\.(mp3|m4a|flac|wav|ogg|opus|aac)$/i.test(f.name)){
          files.push({ name: f.name.replace(/\.[^.]+$/, ''), file: f });
        }
      }
    }
    return files.map(function(item){
      return { name: item.name, url: URL.createObjectURL(item.file), lrc: lrcMap[item.name] || '' };
    });
  }

  /**
   * ★ 刷新「已经选过的那个文件夹」（不然还得重新进去选择一下，有点麻烦 ✓）
   *
   * 走的是**存下来的那个文件夹句柄**（IndexedDB 里那份）⇒ 不用再挑一遍路径 ✓；
   * 权限要重给就弹一次系统授权（必须由点击触发，所以这条路径只可能是点出来的 ✓）。
   *
   * ⚠️ 红线：**刷新不许顺手把正在放的歌停掉** ——
   *   所以先把"在放哪首 / 放到几分几秒 / 是不是在播"记下来，刷完按**名字**找回继续放 ✓；
   *   那首被删了才退回"没选歌"，并且把这件事说出来（不许静默变了 ✗）
   */
  async function refreshMusicFolder(verb){
    verb = verb || '刷新';
    if(!('showDirectoryPicker' in window)){ showToast('这个浏览器不支持，只能重新选文件夹'); return; }
    var keepName = null, keepTime = 0, keepPlaying = false, next = null;
    try{
      var handle = musicFolderHandle || await idbGet('musicHandle');
      if(!handle){ showToast('还没选过文件夹'); return; }
      var perm = await handle.queryPermission({ mode:'read' });
      if(perm !== 'granted') perm = await handle.requestPermission({ mode:'read' });
      if(perm !== 'granted'){ showToast('没给读取权限，读不了这个文件夹'); return; }
      if(musicIndex >= 0 && musicList[musicIndex]){
        keepName = musicList[musicIndex].name;
        keepTime = audioPlayer.currentTime || 0;
        keepPlaying = !audioPlayer.paused;
      }
      next = await scanMusicFolder(handle);
    }catch(e){ showToast(verb + '失败：' + ((e && e.message) || e)); return; }
    musicList = next;
    // 文件夹名 + 那句"下次可以恢复「X」"的提示也顺手对齐（跟着当前这个文件夹 ✓）
    musicFolderHandle = handle;
    if(handle && handle.name){
      musicFolderName = handle.name;
      saveLS('bc_music_meta', JSON.stringify({ folder: handle.name }));
    }
    var idx = -1;
    if(keepName !== null){
      for(var i = 0; i < musicList.length; i++){ if(musicList[i].name === keepName){ idx = i; break; } }
    }
    if(idx >= 0){
      musicIndex = idx;
      audioPlayer.src = musicList[idx].url;
      if(keepTime > 0){
        var onMeta = function(){
          try{ audioPlayer.currentTime = keepTime; }catch(e3){}
          try{ audioPlayer.removeEventListener('loadedmetadata', onMeta); }catch(e4){}
        };
        try{ audioPlayer.addEventListener('loadedmetadata', onMeta); }catch(e5){}
      }
      if(keepPlaying) audioPlayer.play().catch(function(){});
    }else{
      musicIndex = -1; audioPlayer.pause();
    }
    renderMain();
    if(idx >= 0) showToast(verb + '好了：' + musicList.length + ' 首（「' + keepName + '」接着放）');
    else if(keepName) showToast(verb + '好了：' + musicList.length + ' 首，「' + keepName + '」已经不在文件夹里了');
    else showToast(verb + '好了：' + musicList.length + ' 首音乐');
  }

  function parseLrc(text){
    if(!text) return [];
    var lines = String(text).split(/\r?\n/);

    for(var i = 0; i < lines.length; i++){
      var line = lines[i];
      var tags = [];
      var re = /\[(\d+):(\d+)(?:[.:](\d+))?\]/g;
      var m;
      while((m = re.exec(line)) !== null){
        var min = parseInt(m[1], 10);
        var sec = parseInt(m[2], 10);
        var ms = m[3] ? parseInt((m[3] + '00').slice(0, 3), 10) : 0;
        tags.push(min * 60 + sec + ms / 1000);
      }
      var content = line.replace(re, '').trim();
      if(!content) continue;
      for(var t = 0; t < tags.length; t++) out.push({ time: tags[t], text: content });
    }
    out.sort(function(a, b){ return a.time - b.time; });
    return out;
  }

      if(!audioFiles.length){ showToast('未找到音频文件'); return; }

      var folderName = '';
      if(first.webkitRelativePath) folderName = first.webkitRelativePath.split('/')[0] || '';
      if(folderName){ musicFolderName = folderName; saveLS('bc_music_meta', JSON.stringify({ folder: folderName })); }

      files.forEach(function(f){
        if(/\.lrc$/i.test(f.name)){
          var base = f.name.replace(/\.lrc$/i, '');

          var p = new Promise(function(res){
            fr.onload = function(){ lrcMap[base] = String(fr.result || ''); res(); };

          });
          fr.readAsText(f);
          readers.push(p);

      });

        musicList = audioFiles.map(function(f){

    /* ★ 关闭面板（2026-10-31）：TT 手机上外壳顶栏没显示出来 ⇒ 面板里自带一个退出口。
       同源 iframe ⇒ 直接叫父页面的外壳函数；万一没有就自己把 .bc-root 的 show 摘掉 ✓ */
    $('btnClosePanel').addEventListener('click', function(){
      try{
        var p = window.parent;
        if(p && typeof p.__bodycordClosePanel === 'function'){ p.__bodycordClosePanel(); return; }
        var root = p && p.document && p.document.getElementById('bc-root');
        if(root){ root.classList.remove('show'); return; }
      }catch(e){ /* 跨域时什么也做不了 */ }
    });
    $('btnCopy').addEventListener('click', window.__copyStatus);
    $('serverHeader').addEventListener('click', function(){
      // 手机形态那颗标题是"抽屉的头"（点它 = 收起）；桌面才是老的"收起成图标栏" ✓
      if(isPhoneForm()) closeDrawer(); else toggleChannel();
    });
    $('btnDrawer').addEventListener('click', toggleDrawer);
    $('drawerMask').addEventListener('click', closeDrawer);
    // 离开手机形态了（横屏手机转回竖屏、或桌面把窗口拉大）⇒ 把抽屉状态清掉，
    // 否则那个 `.drawer-open` 会留着，回到桌面时看着像"侧栏莫名在被推来推去" ✗
    // ⚠️ 手机转横屏**不再算"离开手机形态"**（横屏也是抽屉形态）⇒ 抽屉开着就留着 ✓
    if(PHONE_MQ){
      var onPhoneFormChange = function(){ if(!isPhoneForm()) closeDrawer(); };
      if(PHONE_MQ.addEventListener) PHONE_MQ.addEventListener('change', onPhoneFormChange);
      else if(PHONE_MQ.addListener) PHONE_MQ.addListener(onPhoneFormChange);
    }
    var channels = document.querySelectorAll('.channel-item[data-view]');
    for(var i = 0; i < channels.length; i++){
      // 手机上选完频道要把抽屉收回去（不点遮罩直接选是最常见的路径 ✓）
      (function(el){ el.addEventListener('click', function(){ switchView(el.dataset.view); closeDrawer(); }); })(channels[i]);
    }
    var icons = document.querySelectorAll('.channel-icon-btn[data-view]');
    for(var j = 0; j < icons.length; j++){
      (function(el){ el.addEventListener('click', function(){ switchView(el.dataset.view); closeDrawer(); }); })(icons[j]);
    }
    $('btnSearch').addEventListener('click', function(){ openSearch(); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        // ⚠️ 随手记按 ESC 时不跟随主面板一起关闭、停留在界面上不消失 ✗
        //   ⇒ 真因：焦点在 iframe 里时，**keydown 不会冒泡到父窗口**，面板只收自己的浮层、
        //     收完就把这个 ESC 吞掉了 ⇒ **面板永远关不掉**（预期是"先收浮层、再按关面板"✗）
        //   ⇒ 能收的先收；**一个浮层都没有可收时，把 ESC 交回外壳去关面板** ✓
        var closed = false;
        // 手机版：先收抽屉（抽屉不算"浮层"，收完它还要能轮到下一步 ✓）
        if(drawerOpen()){ closeDrawer(); closed = true; }
        if($('noteModalOverlay').classList.contains('show')){ window.closeNoteModal(); closed = true; }
        if($('insemAllOverlay') && $('insemAllOverlay').classList.contains('show')){ window.__closeInsemAll(); closed = true; }
        if($('bcDetailOverlay') && $('bcDetailOverlay').classList.contains('show')){ window.__closeDetail(); closed = true; }
        try{
          if($('searchOverlay').classList.contains('show')){ window.closeSearch(); closed = true; }
          if($('userMenu').classList.contains('show')){ $('userMenu').classList.remove('show'); closed = true; }
        }catch(e2){ /* 忽略 */ }
        if(!closed){
          try{ window.parent.postMessage({ __bodycord: true, type: 'esc' }, '*'); }catch(e3){}
        }
      }
      if(e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey){
        var k = e.key;
        if(k === 'm' || k === 'M'){ e.preventDefault(); toggleMask(); }
        else if(k === 't' || k === 'T'){ e.preventDefault(); toggleTheme(); }
        else if(k === '1'){ e.preventDefault(); switchView('overview'); }
        else if(k === '2'){ e.preventDefault(); switchView('fetus'); }
        else if(k === '3'){ e.preventDefault(); switchView('zones'); }
        else if(k === '4'){ e.preventDefault(); switchView('calc'); }
        else if(k === '5'){ e.preventDefault(); switchView('localmusic'); }
        else if(k === '6'){ e.preventDefault(); switchView('netease'); }
        else if(k === '7'){ e.preventDefault(); switchView('notes'); }
        else if(k === '8'){ e.preventDefault(); switchView('period'); }
      }
    });
  }
  function render(overrideRaw){
    var raw = overrideRaw !== undefined ? overrideRaw : $('time-capsule').value;
    // 换了聊天 ⇒ 回到「本聊天」那一份；进出聊天 ⇒ 重新读一次
    //（统一走实时读数 notesLiveChatKey()，非聊天页面看着是 global 由 notesScopeNow() 算，
    //  不在这里改 notesScope —— 否则从非聊天页面回到聊天会一直停在全局那份 ✗）
    var notesNow = notesLiveChatKey();
    if(notesNow !== notesChatKeyLoaded && notesNow !== 'global') notesScope = 'chat';
    refreshNotesIfNeeded();
    // ⚠️ 不能比 `currentProfile.raw`：parseProfiles() 产出的对象**没有 raw 字段** ✗
    //   ⇒ prevRaw 恒为 null ⇒ 每次 render（含外壳每次推数据）都把「上次更新时间」重置成"刚刚"，
    //     从 localStorage 还原的那个时间戳等于白做。
    //   ⇒ 改成自己记一份"上一次渲染用的原文" ✓
    var prevRaw = lastRenderedRaw;
    currentProfile = parseProfiles(raw)[0] || null;
    currentPeriods = parsePeriodProfiles(raw);
    if(currentProfile && currentProfile.calc){
      recordDivination(currentProfile);
    }
    // ⚠️ **空原文不算"更新过"**（重新进酒馆还是刚刚更新的其中一半）——
    //   面板刚起来、外壳还没推数据时 raw 可能是空的，那时候盖时间戳等于每次重进都重置 ✗
    if(raw && (prevRaw === null || prevRaw !== raw)){
      markUpdated();
      // ★ 把这一趟的原文也存下来（重启后 initUpdateTs 读它 ⇒ 内容没变就不再重置 ✓）
      //   ⚠️ 这个键现在**由外壳代管**（正本在聊天数据里，见 src/bodycord.js 的 SHELL_KEYS）：
      //     读走 shim 带下来的那份、写转发给外壳 ⇒ 不依赖面板 iframe 的浏览器缓存 ✓
      saveLS(getRawKey(), raw);
    }
    // ⚠️ 空的那一趟别把记录冲掉（不然下一次真数据进来会被当成"变了" ✗）
    if(raw) lastRenderedRaw = raw;
    renderMain();
  }
  bindEvents();
  initUserMenu();
  initMusicFolder();
  initNotes();
  initVolume();
  initCollapse();
  initState();
  initGroupCollapse();
  initUpdateTs();
  window.__bodycordSetRaw = function(raw){
    try{ $('time-capsule').value = String(raw==null?'':raw); render(); }
    catch(e){ console.error('[bodycord] setRaw failed', e); }
  };
  render();
  startAvatar();
})();
</script>
</body>
</html>
